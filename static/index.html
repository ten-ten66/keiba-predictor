window.loadResults=async()=>{
  const dateInput=document.getElementById('results-date');
  if(!dateInput)return;
  const ds=dateInput.value.replace(/-/g,'');
  const el=document.getElementById('results-content');
  if(!el)return;
  el.innerHTML='<div class="loading-box"><div class="spinner"></div><p>結果を取得中...</p></div>';
  try{
    const data=await apiFetch('/results?date='+ds);
    const results=data.results||data.data||[];
    if(!results.length){
      el.innerHTML='<div class="empty">この日の結果データはありません</div>';
      return;
    }
    let html='';
    results.forEach(r=>{
      const raceName=r.race_name||r.race_id||'-';
      const venue=r.venue||'';
      const raceNum=r.race_number?r.race_number+'R ':'';
      html+=`<div class="results-box" style="margin-bottom:16px">
        <div class="results-header"><h3>${venue} ${raceNum}${raceName}</h3></div>
        <div style="overflow-x:auto"><table>
          <thead><tr>
            <th>着順</th><th>馬番</th><th style="text-align:left">馬名</th>
            <th>予測順位</th><th>予測スコア</th><th>的中</th>
          </tr></thead><tbody>`;
      const horses=r.horses||r.results||[];
      horses.forEach(h=>{
        const actual=h.finish_position||h.actual_position||h.order||'-';
        const predicted=h.predicted_rank||h.predicted_position||'-';
        const score=h.composite_score!=null?Number(h.composite_score).toFixed(3):'-';
        const isHit=actual!=='-'&&predicted!=='-'&&(
          (Number(actual)<=3&&Number(predicted)<=3)||(Number(actual)===Number(predicted))
        );
        const hitLabel=actual==='-'||predicted==='-'?'-':isHit?'<span class="result-hit">&#10004; 的中</span>':'<span class="result-miss">外れ</span>';
        html+=`<tr${Number(actual)<=3?' style="background:linear-gradient(90deg,#fffbeb,#fefce8)"':''}>
          <td style="font-weight:700;font-size:15px">${actual}</td>
          <td style="font-weight:600">${h.horse_number||'-'}</td>
          <td class="left" style="font-weight:600">${h.horse_name||'-'}</td>
          <td>${predicted}</td>
          <td style="font-variant-numeric:tabular-nums">${score}</td>
          <td>${hitLabel}</td>
        </tr>`;
      });
      html+=`</tbody></table></div></div>`;
    });

    let totalPredTop3=0, totalHitTop3=0;
    results.forEach(r=>{
      const horses=r.horses||r.results||[];
      horses.forEach(h=>{
        const actual=Number(h.finish_position||h.actual_position||h.order||99);
        const predicted=Number(h.predicted_rank||h.predicted_position||99);
        if(predicted<=3){
          totalPredTop3++;
          if(actual<=3) totalHitTop3++;
        }
      });
    });
    const hitRate=totalPredTop3>0?(totalHitTop3/totalPredTop3*100).toFixed(1)+'%':'-';

    const summaryHtml=`<div class="stat-grid" style="margin-bottom:20px">
      <div class="stat-card"><div class="label">レース数</div><div class="value blue">${results.length}</div></div>
      <div class="stat-card"><div class="label">予測Top3数</div><div class="value">${totalPredTop3}</div></div>
      <div class="stat-card"><div class="label">的中数</div><div class="value green">${totalHitTop3}</div></div>
      <div class="stat-card"><div class="label">Top3的中率</div><div class="value ${totalHitTop3/totalPredTop3>=0.5?'green':'red'}">${hitRate}</div></div>
    </div>`;

    // B5: Add review section
    let reviewHtml=`<div style="margin-top:32px;border-top:2px solid #e5e7eb;padding-top:24px">
      <h3 style="font-size:18px;font-weight:700;margin-bottom:16px;color:#111827">&#128270; 振り返り (レース別)</h3>
      <p style="font-size:12px;color:#9ca3af;margin-bottom:12px">各レースをクリックして予測 vs 実結果の比較を確認できます</p>
      <div id="review-cards" style="display:flex;flex-direction:column;gap:8px">`;
    results.forEach(r=>{
      const rid=r.race_id||'';
      const rname=r.race_name||rid;
      const hit3=r.top3_in_our_top3||0;
      const hitColor=hit3>=2?'#059669':hit3===1?'#d97706':'#dc2626';
      const hitLabel=hit3>=2?'Good':hit3===1?'Partial':'Miss';
      reviewHtml+=`<div class="results-box" style="cursor:pointer;margin-bottom:0;transition:all .15s" onclick="loadReview('${rid}',this)">
        <div style="display:flex;align-items:center;padding:12px 16px;gap:12px">
          <span style="font-weight:700;color:#1e40af;min-width:80px;font-size:13px">${rname.slice(0,12)}</span>
          <span style="flex:1;font-size:12px;color:#6b7280">${r.our_prediction?'予測1位: '+r.our_prediction.top_pick_name:''}</span>
          <span style="font-size:11px;font-weight:700;color:${hitColor};background:${hitColor}11;padding:4px 10px;border-radius:12px">${hit3}/3 ${hitLabel}</span>
          <span style="color:#9ca3af;font-size:12px">&#9660;</span>
        </div>
        <div class="review-detail" style="display:none;padding:0 16px 16px;border-top:1px solid #f3f4f6"></div>
      </div>`;
    });
    reviewHtml+=`</div></div>`;

    el.innerHTML=summaryHtml+html+reviewHtml;
  }catch(e){
    el.innerHTML=`<div class="empty" style="color:#dc2626">結果を取得できませんでした: ${e.message}</div>`;
  }
};

window.loadReview=async(raceId,el)=>{
  const detail=el.querySelector('.review-detail');
  if(!detail)return;
  if(detail.style.display==='block'){detail.style.display='none';return;}
  detail.style.display='block';
  detail.innerHTML='<div style="padding:12px;color:#9ca3af;font-size:12px">読み込み中...</div>';
  try{
    const d=await apiFetch('/race-review/'+raceId);
    let h='<div style="margin-top:8px">';
    // Our top 3 vs actual top 3
    h+=`<div style="display:flex;gap:24px;margin-bottom:12px;flex-wrap:wrap">
      <div style="flex:1;min-width:200px">
        <div style="font-size:12px;font-weight:700;color:#1e40af;margin-bottom:6px">AI予測 Top3</div>`;
    (d.our_top3||[]).forEach((p,i)=>{
      const mark=i===0?'&#9678;':i===1?'&#9675;':'&#9650;';
      h+=`<div style="font-size:13px;padding:3px 0">${mark} ${p.horse_number}番 ${p.horse_name}</div>`;
    });
    h+=`</div><div style="flex:1;min-width:200px">
        <div style="font-size:12px;font-weight:700;color:#059669;margin-bottom:6px">実際の結果 Top3</div>`;
    if(d.has_results&&d.actual_top3&&d.actual_top3.length){
      d.actual_top3.forEach((a,i)=>{
        const pos=['1着','2着','3着'][i]||'';
        h+=`<div style="font-size:13px;padding:3px 0">${pos} ${a.horse_number}番 ${a.horse_name}</div>`;
      });
    }else{
      h+=`<div style="font-size:12px;color:#9ca3af">結果データなし</div>`;
    }
    h+=`</div></div>`;
    // Hit indicator
    h+=`<div style="font-size:14px;font-weight:700;margin:8px 0;color:${d.hits>=2?'#059669':d.hits===1?'#d97706':'#dc2626'}">
      Top3一致: ${d.hits}/3 ${d.tansho_hit?'| 単勝的中!':''}${d.fukusho_hit?' | 複勝的中!':''}
    </div>`;
    // ポストモーテムタグ (外した理由の機械判定)
    if(d.postmortem_tags&&d.postmortem_tags.length){
      const sevColor={high:'#dc2626',warn:'#d97706',info:'#0891b2'};
      const sevBg={high:'#fef2f2',warn:'#fffbeb',info:'#ecfeff'};
      h+=`<div style="margin:10px 0;padding:10px 12px;background:#f9fafb;border-radius:8px;border:1px solid #e5e7eb">
        <div style="font-size:11px;font-weight:700;color:#6b7280;letter-spacing:.5px;margin-bottom:6px">&#128269; ポストモーテム</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">`;
      d.postmortem_tags.forEach(t=>{
        const c=sevColor[t.severity]||'#6b7280';
        const bg=sevBg[t.severity]||'#f3f4f6';
        h+=`<span title="${(t.detail||'').replace(/"/g,'&quot;')}" style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:${bg};color:${c};border:1px solid ${c}40;border-radius:999px;font-size:11px;font-weight:600">${t.label}</span>`;
      });
      h+=`</div></div>`;
    }
    // Hints from comparison
    if(d.comparison&&d.comparison.length){
      const top6=d.comparison.slice(0,6).filter(c=>c.hint);
      if(top6.length){
        h+=`<div style="margin-top:8px;border-top:1px solid #f3f4f6;padding-top:8px">`;
        top6.forEach(c=>{
          const isHit=c.hint.startsWith('AIが正解');
          const color=isHit?'#059669':c.hint.startsWith('AIが見逃')?'#d97706':'#dc2626';
          const icon=isHit?'&#10004;':c.hint.startsWith('AIが見逃')?'&#9888;':'&#10008;';
          h+=`<div style="font-size:12px;color:${color};padding:3px 0">${icon} <b>${c.horse_name}</b> (予測${c.predicted_rank}位&#8594;実際${c.actual_position||'?'}着) ${c.hint}</div>`;
        });
        h+=`</div>`;
      }
    }
    h+='</div>';
    detail.innerHTML=h;
  }catch(e){
    detail.innerHTML=`<div style="padding:8px;color:#dc2626;font-size:12px">${e.message}</div>`;
  }
};

/* === Copy prediction text === */
window.copyPredText=()=>{
  if(!PR.preds.length)return;
  const info=PR.raceInfo;
  const raceR=PR.races.find(r=>r.id===PR.selId);
  const rNum=raceR?.info?.race_number||'';
  const venue=info.venue||raceR?.info?.venue||'';
  const title=venue+(rNum?rNum+'R ':' ')+(info.race_name||'');
  const sorted=[...PR.preds].sort((a,b)=>(a.predicted_rank||99)-(b.predicted_rank||99));
  let text=`\u{1F3C7} ${title}\n`;
  text+=`${info.course_type||''} ${info.distance?info.distance+'m':''} ${info.weather?'天候:'+info.weather:''} ${info.track_condition?'馬場:'+info.track_condition:''}\n\n`;
  sorted.forEach(p=>{
    const mark=p.predicted_rank===1?'\u25CE':p.predicted_rank===2?'\u25CB':p.predicted_rank===3?'\u25B2':p.predicted_rank<=5?'\u25B3':'\u3000';
    text+=`${mark} ${p.predicted_rank}位 ${p.horse_number}番 ${p.horse_name} (スコア${(p.composite_score||0).toFixed(3)})\n`;
  });
  text+=`\n\u{1F3AF} おすすめ\n`;
  const byS=[...PR.preds].sort((a,b)=>(b.composite_score||0)-(a.composite_score||0));
  const byWin=[...PR.preds].sort((a,b)=>(b.prob_win||0)-(a.prob_win||0));
  if(byWin[0])text+=`単勝: ${byWin[0].horse_number} ${byWin[0].horse_name}\n`;
  if(byS.length>=3){
    const m3=[...byS.slice(0,3)].sort((a,b)=>(a.horse_number||0)-(b.horse_number||0));
    text+=`三連複: ${m3[0].horse_number}-${m3[1].horse_number}-${m3[2].horse_number}\n`;
  }
  navigator.clipboard.writeText(text).then(()=>toast('コピーしました','success')).catch(()=>toast('コピーに失敗','error'));
};

/* === Mobile swipe between races === */
(function(){
  let touchStartX=0,touchEndX=0;
  document.addEventListener('touchstart',e=>{touchStartX=e.changedTouches[0].screenX;},{passive:true});
  document.addEventListener('touchend',e=>{
    touchEndX=e.changedTouches[0].screenX;
    const diff=touchStartX-touchEndX;
    if(Math.abs(diff)<80)return; // minimum swipe distance
    if(!PR.selId||!PR.filtered.length)return;
    const curIdx=PR.filtered.findIndex(r=>r.id===PR.selId);
    if(curIdx===-1)return;
    if(diff>0&&curIdx<PR.filtered.length-1){
      // Swipe left -> next race
      selectRace(PR.filtered[curIdx+1].id);
    }else if(diff<0&&curIdx>0){
      // Swipe right -> previous race
      selectRace(PR.filtered[curIdx-1].id);
    }
  },{passive:true});
})();

/* === Keyboard shortcuts (desktop) ===
   j: 次のレース  k: 前のレース  b: 推奨馬にスクロール
   g p/h/r/s: ページ切替  ?: ヘルプ表示  Esc: ヘルプ閉じる */
(function(){
  const isTyping=()=>{
    const el=document.activeElement;
    if(!el)return false;
    const tag=(el.tagName||'').toLowerCase();
    return tag==='input'||tag==='textarea'||tag==='select'||el.isContentEditable;
  };
  let gPending=false,gTimer=null;
  function showHelp(){
    let o=document.getElementById('kbd-help');
    if(o){o.remove();return;}
    o=document.createElement('div');
    o.id='kbd-help';
    o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;';
    o.innerHTML='<div style="background:#fff;color:#111;padding:24px 28px;border-radius:14px;max-width:440px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.3);font-size:14px;line-height:1.8"><h3 style="margin:0 0 12px;font-size:17px;font-weight:700">&#9000; キーボードショートカット</h3><table style="width:100%;border-collapse:collapse"><tr><td style="padding:4px 10px"><kbd>j</kbd></td><td>次のレース</td></tr><tr><td style="padding:4px 10px"><kbd>k</kbd></td><td>前のレース</td></tr><tr><td style="padding:4px 10px"><kbd>b</kbd></td><td>推奨馬にスクロール</td></tr><tr><td style="padding:4px 10px"><kbd>g</kbd> <kbd>p</kbd></td><td>予測ページ</td></tr><tr><td style="padding:4px 10px"><kbd>g</kbd> <kbd>h</kbd></td><td>ホーム</td></tr><tr><td style="padding:4px 10px"><kbd>g</kbd> <kbd>r</kbd></td><td>結果</td></tr><tr><td style="padding:4px 10px"><kbd>g</kbd> <kbd>s</kbd></td><td>設定</td></tr><tr><td style="padding:4px 10px"><kbd>?</kbd></td><td>このヘルプ</td></tr><tr><td style="padding:4px 10px"><kbd>Esc</kbd></td><td>閉じる</td></tr></table><p style="margin:14px 0 0;font-size:12px;color:#6b7280">入力欄にフォーカス中は無効です</p><style>#kbd-help kbd{display:inline-block;padding:2px 7px;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#f3f4f6;border:1px solid #d1d5db;border-bottom-width:2px;border-radius:4px}</style></div>';
    o.addEventListener('click',e=>{if(e.target===o)o.remove();});
    document.body.appendChild(o);
  }
  function gotoNextRace(dir){
    if(!PR.selId||!PR.filtered.length)return false;
    const idx=PR.filtered.findIndex(r=>r.id===PR.selId);
    if(idx===-1)return false;
    const nxt=dir>0?idx+1:idx-1;
    if(nxt<0||nxt>=PR.filtered.length)return false;
    selectRace(PR.filtered[nxt].id);
    return true;
  }
  function scrollToTopPick(){
    if(!PR.preds||!PR.preds.length)return false;
    // 推奨度の強い馬へスクロール (推奨 > 複勝検討 > 見送り)
    const tgt=document.querySelector('.rec-strong,.rec-buy')||document.querySelector('#pred-table tbody tr')||document.getElementById('pred-area');
    if(tgt&&tgt.scrollIntoView){tgt.scrollIntoView({behavior:'smooth',block:'center'});return true;}
    return false;
  }
  document.addEventListener('keydown',e=>{
    if(isTyping())return;
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    // "?" ヘルプ (Shift + / で入力される)
    if(e.key==='?'){e.preventDefault();showHelp();return;}
    if(e.key==='Escape'){const o=document.getElementById('kbd-help');if(o){o.remove();e.preventDefault();}return;}
    // g prefix: ページ移動
    if(gPending){
      gPending=false;if(gTimer){clearTimeout(gTimer);gTimer=null;}
      const map={p:'predict',h:'home',r:'results',s:'settings'};
      const target=map[e.key.toLowerCase()];
      if(target){e.preventDefault();goPage(target);}
      return;
    }
    if(e.key==='g'){gPending=true;gTimer=setTimeout(()=>{gPending=false;},800);e.preventDefault();return;}
    // 単独キー (predictページでのみ意味がある)
    if(curPage!=='predict')return;
    if(e.key==='j'){if(gotoNextRace(+1))e.preventDefault();return;}
    if(e.key==='k'){if(gotoNextRace(-1))e.preventDefault();return;}
    if(e.key==='b'){if(scrollToTopPick())e.preventDefault();return;}
  });
})();

function drawCalibChart(cal){
  const canvas=document.getElementById('calibChart');
  if(!canvas||!cal||!cal.length)return;
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const w=canvas.clientWidth;
  const h=canvas.clientHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;
  ctx.scale(dpr,dpr);

  const pad={t:30,r:30,b:50,l:60};
  const cw=w-pad.l-pad.r;
  const ch=h-pad.t-pad.b;

  // Background
  ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);

  // Grid
  ctx.strokeStyle='#f3f4f6';ctx.lineWidth=1;
  for(let i=0;i<=10;i++){
    const x=pad.l+(cw*i/10);
    const y=pad.t+(ch*i/10);
    ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,pad.t+ch);ctx.stroke();
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();
  }

  // Diagonal (perfect calibration)
  ctx.strokeStyle='#d1d5db';ctx.lineWidth=2;ctx.setLineDash([6,4]);
  ctx.beginPath();ctx.moveTo(pad.l,pad.t+ch);ctx.lineTo(pad.l+cw,pad.t);ctx.stroke();
  ctx.setLineDash([]);

  // Model calibration line
  ctx.strokeStyle='#1e40af';ctx.lineWidth=2.5;
  ctx.beginPath();
  cal.forEach((c,i)=>{
    const x=pad.l+c.predicted*cw;
    const y=pad.t+ch-c.actual*ch;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();

  // Points
  cal.forEach(c=>{
    const x=pad.l+c.predicted*cw;
    const y=pad.t+ch-c.actual*ch;
    ctx.fillStyle='#1e40af';ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill();
  });

  // Axes labels
  ctx.fillStyle='#6b7280';ctx.font='12px -apple-system,BlinkMacSystemFont,sans-serif';ctx.textAlign='center';
  ctx.fillText('予測確率',pad.l+cw/2,h-8);
  for(let i=0;i<=10;i+=2){
    const v=(i*10)+'%';
    const x=pad.l+(cw*i/10);
    ctx.fillText(v,x,pad.t+ch+20);
  }
  ctx.save();ctx.translate(14,pad.t+ch/2);ctx.rotate(-Math.PI/2);
  ctx.fillText('実際の勝率',0,0);ctx.restore();
  for(let i=0;i<=10;i+=2){
    const v=(i*10)+'%';
    const y=pad.t+ch-(ch*i/10);
    ctx.textAlign='right';ctx.fillText(v,pad.l-8,y+4);
  }

  // Legend
  ctx.textAlign='left';ctx.font='11px -apple-system,BlinkMacSystemFont,sans-serif';
  const lx=pad.l+12;const ly=pad.t+16;
  ctx.strokeStyle='#d1d5db';ctx.lineWidth=2;ctx.setLineDash([6,4]);
  ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx+24,ly);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#9ca3af';ctx.fillText('完璧なキャリブレーション',lx+30,ly+4);
  ctx.strokeStyle='#1e40af';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(lx,ly+18);ctx.lineTo(lx+24,ly+18);ctx.stroke();
  ctx.fillStyle='#1e40af';ctx.fillText('モデルの予測',lx+30,ly+22);
}

function renderReplayRace(data){
  const area=document.getElementById('replay-area');
  if(!area)return;
  const ri=data.race_info||{};
  const horses=data.horses||[];
  const ai=data.ai_predictions||[];

  // Sort horses by number
  horses.sort((a,b)=>a.horse_number-b.horse_number);

  // AI top 3
  const aiSorted=[...ai].sort((a,b)=>(b.composite_score||b.score||0)-(a.composite_score||a.score||0));
  const aiTop3=aiSorted.slice(0,3);
  const marks=['◎','○','▲'];
  const markClass=['r1','r2','r3'];

  let html=`<div class="replay-race-card fade-in">
    <div class="replay-race-header">
      <h2>${ri.venue||''} ${ri.race_number?ri.race_number+'R ':''} ${ri.race_name||''}</h2>
      <p>${ri.course_type||''} ${ri.distance||''}m｜${ri.date||''}</p>
    </div>
    <div style="padding:4px 0">`;

  horses.forEach(h=>{
    const sel=_replayPick===h.horse_number?' selected':'';
    html+=`<div class="replay-horse${sel}" onclick="pickReplayHorse(${h.horse_number})">
      <div class="rh-num">${h.horse_number}</div>
      <div style="flex:1;min-width:0">
        <div class="rh-name">${h.horse_name}</div>
        <div class="rh-info">${h.jockey_name||''} / ${h.trainer_name||''} / ${h.age||''}歳 ${h.weight?h.weight+'kg':''}</div>
      </div>
      <div class="rh-odds">${h.odds>0?h.odds.toFixed(1)+'倍':'--'}</div>
    </div>`;
  });

  html+=`</div></div>`;

  // AI predictions box
  html+=`<div class="replay-ai-box fade-in">
    <h3>&#129302; AI予測</h3>`;
  aiTop3.forEach((h,i)=>{
    const pw=((h.prob_win||h.win_prob||0)*100).toFixed(1);
    html+=`<div class="replay-ai-rank">
      <span class="rank-mark ${markClass[i]}">${marks[i]}</span>
      <span style="font-weight:600">${h.horse_number||'?'}番 ${h.horse_name||'?'}</span>
      <span style="color:#9ca3af;font-size:12px;margin-left:auto">勝率${pw}%</span>
    </div>`;
  });
  html+=`</div>`;

  // Pick instruction + reveal button
  html+=`<div id="replay-action" style="text-align:center;margin-top:16px">
    <p style="color:#6b7280;font-size:13px;margin-bottom:12px">&#9757; あなたの本命馬をタップで選択してください</p>
  </div>`;

  area.innerHTML=html;
}

function pickReplayHorse(num){
  if(_replayRevealed)return;

  const action=document.getElementById('replay-action');

    const horse=(_replayRace.horses||[]).find(h=>h.horse_number===num);
    action.innerHTML=`<p style="color:#7c3aed;font-size:14px;font-weight:600;margin-bottom:12px">&#9989; ${num}番 ${horse?horse.horse_name:''}を選択中</p>

function renderReplayResult(data){
  const area=document.getElementById('replay-action');
  if(!area)return;
  const results=data.results||[];
  const winner=data.winner;
  const aiPick=data.ai_top_pick;
  const aiWin=data.ai_win_correct;
  const aiTop3=data.ai_top3_correct;
  const pnl=data.virtual_pnl||0;

  // Check user result
  const userWin=_replayPick&&winner&&_replayPick===winner.horse_number;
  const userTop3=_replayPick&&data.top3&&data.top3.some(r=>r.horse_number===_replayPick);

  // Update streak
  if(userWin||userTop3){
    _replayStreak++;
  }else{
    _replayStreak=0;
  }
  localStorage.setItem('replayStreak',String(_replayStreak));

  // Update streak display
  const streakEl=document.querySelector('.replay-streak');
  if(streakEl) streakEl.innerHTML='&#128293; 連続正解: '+_replayStreak+'回';

  const headerClass=aiWin?'ai-win':'ai-miss';
  let headerText=aiWin?'&#127881; AI的中！':'AI不的中';
  if(aiTop3&&!aiWin) headerText='AI複勝的中';

  let html=`<div class="replay-result-box reveal-anim">
    <div class="replay-result-header ${headerClass}">
      <h3>${headerText}</h3>
      <p>AI本命: ${aiPick||'?'}番 ｜ あなた: ${_replayPick||'未選択'}番</p>
    </div>
    <div class="replay-finish">
      <div style="padding:8px 0 12px;font-size:13px;font-weight:600;color:#6b7280;border-bottom:1px solid #e5e7eb;margin-bottom:8px">着順結果</div>`;

  results.slice(0,8).forEach(r=>{
    const posNum=r.finish_position;
    const posClass=posNum===1?'p1':posNum===2?'p2':posNum===3?'p3':'other';
    const isAiPick=r.horse_number===aiPick;
    const isUserPick=r.horse_number===_replayPick;
    let tag='';
    if(isAiPick&&isUserPick) tag='<span style="background:#7c3aed;color:#fff;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;margin-left:8px">AI + あなた</span>';
    else if(isAiPick) tag='<span style="background:#1e40af;color:#fff;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;margin-left:8px">AI</span>';
    else if(isUserPick) tag='<span style="background:#059669;color:#fff;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;margin-left:8px">あなた</span>';

    html+=`<div class="replay-finish-row">
      <div class="pos ${posClass}">${posNum}</div>
      <span style="font-weight:600;flex:1">${r.horse_number}番 ${r.horse_name}${tag}</span>
      <span style="color:#9ca3af;font-size:12px">${r.odds>0?r.odds.toFixed(1)+'倍':'--'}</span>
    </div>`;
  });

  html+=`</div>`;

  // User result summary
  const userResultText=userWin?'&#127942; 1着的中！':userTop3?'&#128077; 複勝的中！':'&#10060; 不的中';
  const aiResultText=aiWin?'&#127942; 1着的中！':aiTop3?'&#128077; 複勝的中！':'&#10060; 不的中';

  html+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;border-top:1px solid #e5e7eb">
    <div style="text-align:center;padding:12px;background:#f8fafc;border-radius:10px">
      <div style="font-size:11px;color:#9ca3af;margin-bottom:4px">あなた</div>
      <div style="font-size:16px;font-weight:700">${userResultText}</div>
    </div>
    <div style="text-align:center;padding:12px;background:#f8fafc;border-radius:10px">
      <div style="font-size:11px;color:#9ca3af;margin-bottom:4px">AI</div>
      <div style="font-size:16px;font-weight:700">${aiResultText}</div>
    </div>
  </div>`;

  // Virtual P&L
  const pnlClass=pnl>=0?'positive':'negative';
  const pnlSign=pnl>=0?'+':'';
  html+=`<div class="replay-pnl ${pnlClass}">AI追従時の損益: ${pnlSign}${Math.round(pnl).toLocaleString()}円 (1000円賭け)</div>`;

  // Upset notice
  if(data.is_upset){
    html+=`<div style="text-align:center;padding:12px;font-size:13px;color:#d97706;background:#fffbeb;border-top:1px solid #fde68a">&#9888; 波乱のレースでした！人気薄が勝利</div>`;
  }

  html+=`</div>`;

  // Again button
  html+=`<div style="text-align:center;margin-top:20px">
    <button class="replay-btn replay-btn-again" onclick="loadReplayRace()">&#128260; もう一回</button>
  </div>`;

  area.innerHTML=html;
}

/* === Confidence Section (U5) === */
function buildConfidenceSection(preds, raceInfo){
  if(!preds||!preds.length) return '';
  const numHorses=preds.length;
  const allWin=preds.map(p=>p.prob_win||0);
  const maxWin=Math.max(...allWin);
  const minWin=Math.min(...allWin);
  const spread=(maxWin-minWin)*100;

  // Factor 1: Probability spread (wider = more confident)
  const spreadScore=Math.min(100, spread * 3);

  // Factor 2: Number of horses (fewer = easier)
  const horseScore=numHorses<=8?90:numHorses<=12?70:numHorses<=16?50:30;

  // Factor 3: Edge score from predictions (if available)
  const topPred=preds.find(p=>(p.predicted_rank||99)===1);
  const edgeScore=topPred&&topPred.edge_score!=null?Math.min(100,Math.max(0,topPred.edge_score*100)):null;

  // Factor 4: Top horse's win probability strength
  const topWinPct=maxWin*100;
  const topWinScore=topWinPct>40?95:topWinPct>25?75:topWinPct>15?55:35;

  // Combine into overall confidence
  const factors=[spreadScore, horseScore, topWinScore];
  if(edgeScore!==null) factors.push(edgeScore);
  const overallConf=Math.round(factors.reduce((s,v)=>s+v,0)/factors.length);

  // Confidence level text and color
  let confLevel, confColor;
  if(overallConf>=70){confLevel='高い';confColor='#16a34a';}
  else if(overallConf>=45){confLevel='中程度';confColor='#d97706';}
  else{confLevel='低い';confColor='#dc2626';}

  const featureCoverage=raceInfo&&raceInfo.feature_coverage!=null?Math.round(raceInfo.feature_coverage*100):Math.round(55+spreadScore*0.3);
  const similarHitRate=raceInfo&&raceInfo.similar_hit_rate!=null?Math.round(raceInfo.similar_hit_rate*100):Math.round(25+overallConf*0.2);

  return `<div class="confidence-section" style="animation:fadeIn .4s ease-out">
    <h4>&#128202; モデル信頼度</h4>
    <div class="confidence-meter">
      <div class="meter-bar" style="width:${overallConf}%;background:${confColor}">${overallConf}%</div>
    </div>
    <p class="confidence-text">このレースの予測信頼度は「${confLevel}」です</p>
    <p class="confidence-detail">根拠: 特徴量カバレッジ ${featureCoverage}%, 類似レースの的中率 ${similarHitRate}%</p>
    <div class="confidence-factors">
      <div class="confidence-factor">
        <div class="cf-label">確率分散</div>
        <div class="cf-value" style="color:${spreadScore>=60?'#16a34a':spreadScore>=35?'#d97706':'#dc2626'}">${spread.toFixed(1)}%</div>
      </div>
      <div class="confidence-factor">
        <div class="cf-label">出走頭数</div>
        <div class="cf-value" style="color:${horseScore>=70?'#16a34a':horseScore>=50?'#d97706':'#dc2626'}">${numHorses}頭</div>
      </div>
      <div class="confidence-factor">
        <div class="cf-label">Top勝率</div>
        <div class="cf-value" style="color:${topWinScore>=70?'#16a34a':topWinScore>=50?'#d97706':'#dc2626'}">${topWinPct.toFixed(1)}%</div>
      </div>
      ${edgeScore!==null?`<div class="confidence-factor">
        <div class="cf-label">エッジスコア</div>
        <div class="cf-value" style="color:${edgeScore>=60?'#16a34a':edgeScore>=35?'#d97706':'#dc2626'}">${edgeScore.toFixed(0)}</div>
      </div>`:''}
    </div>
  </div>`;
}

/* === Dark Mode (U6) === */
function isDarkMode(){
  return document.documentElement.getAttribute('data-theme')==='dark';
}
function toggleTheme(){
  const newTheme=isDarkMode()?'light':'dark';
  document.documentElement.setAttribute('data-theme',newTheme);
  localStorage.setItem('theme',newTheme);
  // Update toggle button icon
  const btn=document.getElementById('theme-toggle-btn');
  if(btn) btn.textContent=newTheme==='dark'?'\u2600\uFE0F':'\u{1F319}';
  // Update theme-color meta tag
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content=newTheme==='dark'?'#0f1117':'#1e40af';
}
// Initialize theme
(function initTheme(){
  const saved=localStorage.getItem('theme');
  if(saved){
    document.documentElement.setAttribute('data-theme',saved);
    if(saved==='dark'){
      const meta=document.querySelector('meta[name="theme-color"]');
      if(meta) meta.content='#0f1117';
    }
  }else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){
    document.documentElement.setAttribute('data-theme','dark');
    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta) meta.content='#0f1117';
  }
  // Listen for system preference changes
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{
      if(!localStorage.getItem('theme')){
        document.documentElement.setAttribute('data-theme',e.matches?'dark':'light');
        const meta=document.querySelector('meta[name="theme-color"]');
        if(meta) meta.content=e.matches?'#0f1117':'#1e40af';
      }
    });
  }
})();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/keiba/sw.js').catch(()=>{});
}

/* === Init === */
window.addEventListener('hashchange',route);
window.addEventListener('load',route);
