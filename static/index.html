<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/keiba/manifest.json">
<meta name="theme-color" content="#1e40af">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="/keiba/icon.svg">
<link rel="apple-touch-icon" href="/keiba/icon-192.png">
<title>競馬予測AI</title>
<style>
/* === Dark Mode Variables === */
:root{--bg-primary:#f8f9fa;--bg-card:#fff;--bg-card-alt:#f9fafb;--bg-hover:#f8fafc;--bg-active:#f3f4f6;--bg-input:#f9fafb;--border:#e5e7eb;--border-light:#f3f4f6;--text-primary:#111827;--text-secondary:#6b7280;--text-muted:#9ca3af;--shadow-sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.05)}
[data-theme="dark"]{--bg-primary:#0f1117;--bg-card:#1a1d2e;--bg-card-alt:#1f2337;--bg-hover:#252a3e;--bg-active:#2a2e45;--bg-input:#1f2337;--border:#2a2e45;--border-light:#232740;--text-primary:#e8eaf0;--text-secondary:#8b8fa3;--text-muted:#5f6378;--shadow-sm:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 4px 12px rgba(0,0,0,.3)}
[data-theme="dark"] body{background:var(--bg-primary);color:var(--text-primary)}
[data-theme="dark"] .topnav{background:var(--bg-card);box-shadow:var(--shadow-sm)}
[data-theme="dark"] .topnav .nav-links a{color:var(--text-secondary)}
[data-theme="dark"] .topnav .nav-links a:hover{background:var(--bg-hover);color:var(--text-primary)}
[data-theme="dark"] .topnav .nav-links a.active{color:#60a5fa}
[data-theme="dark"] .topnav .nav-links a.active::after{background:#60a5fa}
[data-theme="dark"] .topnav .user-info{color:var(--text-muted)}
[data-theme="dark"] .topnav .logout-btn{color:var(--text-secondary);background:var(--bg-card-alt);border-color:var(--border)}
[data-theme="dark"] .topnav .logout-btn:hover{color:#f87171;border-color:#7f1d1d;background:#1c1012}
[data-theme="dark"] .date-tab{background:var(--bg-card);border-color:var(--border);color:var(--text-secondary)}
[data-theme="dark"] .date-tab:hover{border-color:#3b82f6;color:#60a5fa;background:var(--bg-hover)}
[data-theme="dark"] .date-tab.active{background:#1e40af;border-color:#1e40af;color:#fff}
[data-theme="dark"] .date-tab-custom input{background:var(--bg-input);border-color:var(--border);color:var(--text-primary)}
[data-theme="dark"] .grade-pill{background:var(--bg-card);border-color:var(--border);color:var(--text-secondary)}
[data-theme="dark"] .grade-pill:hover{border-color:#3b82f6;color:#60a5fa;background:var(--bg-hover)}
[data-theme="dark"] .grade-pill.active{background:#1e40af;color:#fff;border-color:#1e40af}
[data-theme="dark"] .venue-section{background:var(--bg-card);border-color:var(--border)}
[data-theme="dark"] .venue-header{background:var(--bg-card-alt) !important;border-color:var(--border)}
[data-theme="dark"] .race-row{border-color:var(--border-light);color:var(--text-primary)}
[data-theme="dark"] .race-row:hover{background:var(--bg-hover)}
[data-theme="dark"] .race-row.selected{background:#1a2744;border-left-color:#3b82f6}
[data-theme="dark"] .race-row .rname{color:var(--text-primary)}
[data-theme="dark"] .race-row .rmeta{color:var(--text-muted)}
[data-theme="dark"] .race-row .rhorses{background:var(--bg-card-alt);color:var(--text-secondary)}
[data-theme="dark"] .pred-box{background:var(--bg-card);border-color:var(--border)}
[data-theme="dark"] thead th{background:var(--bg-card-alt);color:var(--text-secondary);border-color:var(--border)}
[data-theme="dark"] thead th:hover{color:#60a5fa;background:var(--bg-hover)}
[data-theme="dark"] tbody tr{border-color:var(--border-light)}
[data-theme="dark"] tbody tr:nth-child(even){background:var(--bg-card-alt)}
[data-theme="dark"] tbody tr:hover{background:var(--bg-hover)}
[data-theme="dark"] tbody td{color:var(--text-primary)}
[data-theme="dark"] tr.rank-1{background:linear-gradient(90deg,#2a2410,#282210) !important}
[data-theme="dark"] tr.rank-2{background:linear-gradient(90deg,#1f2130,#1e2030) !important}
[data-theme="dark"] tr.rank-3{background:linear-gradient(90deg,#2a2410,#282210) !important}
[data-theme="dark"] .stat-card{background:var(--bg-card);border-color:var(--border)}
[data-theme="dark"] .stat-card .label{color:var(--text-muted)}
[data-theme="dark"] .stat-card .value{color:var(--text-primary)}
[data-theme="dark"] .rec-card{background:var(--bg-card);border-color:var(--border)}
[data-theme="dark"] .rec-card .rec-ev{color:var(--text-muted)}
[data-theme="dark"] .rec-card .rec-value{color:var(--text-primary)}
[data-theme="dark"] .no-odds-note{background:#2a2410;border-color:#5c4a1a;color:#d97706}
[data-theme="dark"] .spread-notice{background:#2a2410;border-color:#5c4a1a;color:#d97706}
[data-theme="dark"] .settings-card{background:var(--bg-card);border-color:var(--border)}
[data-theme="dark"] .settings-card h3{color:var(--text-primary)}
[data-theme="dark"] .settings-card input{background:var(--bg-input);border-color:var(--border);color:var(--text-primary)}
[data-theme="dark"] .settings-card input:focus{border-color:#3b82f6;background:var(--bg-card)}
[data-theme="dark"] .table-wrap{background:var(--bg-card);border-color:var(--border)}
[data-theme="dark"] .results-box{background:var(--bg-card);border-color:var(--border)}
[data-theme="dark"] .action-btn{background:var(--bg-card);border-color:var(--border);color:var(--text-secondary)}
[data-theme="dark"] .action-btn:hover{border-color:#3b82f6;color:#60a5fa;background:var(--bg-hover)}
[data-theme="dark"] .empty{color:var(--text-muted)}
[data-theme="dark"] .login-wrap{background:linear-gradient(135deg,#0f1117 0%,#141827 50%,#0f1117 100%)}
[data-theme="dark"] .login-card{background:var(--bg-card);border-color:var(--border)}
[data-theme="dark"] .login-card input{background:var(--bg-input);border-color:var(--border);color:var(--text-primary)}
[data-theme="dark"] .login-card input:focus{border-color:#3b82f6;background:var(--bg-card)}
[data-theme="dark"] .login-card .sub{color:var(--text-muted)}
[data-theme="dark"] .mobile-horse-card{background:var(--bg-card);border-color:var(--border)}
[data-theme="dark"] .mobile-horse-card:active{background:var(--bg-hover)}
[data-theme="dark"] .mobile-horse-card.expanded{border-color:#3b5998}
[data-theme="dark"] .mobile-horse-card .horse-name{color:var(--text-primary)}
[data-theme="dark"] .mobile-horse-card .horse-details{border-color:var(--border-light)}
[data-theme="dark"] .mobile-horse-card .horse-details .detail-item{color:var(--text-secondary)}
[data-theme="dark"] .mobile-horse-card .horse-details .detail-item b{color:var(--text-primary)}
[data-theme="dark"] .bottom-tab-bar{background:var(--bg-card);border-color:var(--border)}
[data-theme="dark"] .bottom-tab-bar .tab-item{color:var(--text-muted)}
[data-theme="dark"] .bottom-tab-bar .tab-item:active{background:var(--bg-hover)}
[data-theme="dark"] .bottom-tab-bar .tab-item.active{color:#60a5fa}
[data-theme="dark"] .bb-wrapper{background:linear-gradient(135deg,#0a0e1a,#111528,#141e3a)}
[data-theme="dark"] .perf-tbl-wrap{background:var(--bg-card);border-color:var(--border)}
[data-theme="dark"] .perf-tbl thead th{background:var(--bg-card-alt);color:var(--text-secondary);border-color:var(--border)}
[data-theme="dark"] .perf-tbl tbody td{border-color:var(--border-light)}
[data-theme="dark"] .perf-tbl tbody tr:hover{background:var(--bg-hover)}
[data-theme="dark"] .perf-card{background:var(--bg-card);border-color:var(--border)}
[data-theme="dark"] .perf-card h3{color:#60a5fa}
[data-theme="dark"] .perf-card p{color:var(--text-secondary)}
[data-theme="dark"] .perf-card .big-val{color:var(--text-primary)}
[data-theme="dark"] .perf-chart-wrap{background:var(--bg-card);border-color:var(--border)}
[data-theme="dark"] .perf-disc{background:#2a2410;border-color:#5c4a1a;color:#b88a2e}
[data-theme="dark"] .replay-race-card{background:var(--bg-card);border-color:var(--border)}
[data-theme="dark"] .replay-horse{border-color:var(--border-light)}
[data-theme="dark"] .replay-horse:hover{background:var(--bg-hover)}
[data-theme="dark"] .replay-horse.selected{background:#1a2744}
[data-theme="dark"] .replay-horse .rh-num{background:var(--bg-card-alt);color:var(--text-primary)}
[data-theme="dark"] .replay-horse .rh-name{color:var(--text-primary)}
[data-theme="dark"] .replay-ai-box{background:var(--bg-card);border-color:var(--border)}
[data-theme="dark"] .replay-result-box{background:var(--bg-card);border-color:var(--border)}
[data-theme="dark"] .replay-finish-row{border-color:var(--border-light)}
[data-theme="dark"] .toast{box-shadow:0 8px 24px rgba(0,0,0,.4)}
[data-theme="dark"] .skeleton{background:linear-gradient(90deg,#1f2337 25%,#2a2e45 50%,#1f2337 75%)}

/* === Dark Mode Toggle Button === */
.theme-toggle{background:none;border:1px solid var(--border,#e5e7eb);width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;color:var(--text-secondary,#6b7280);margin-left:8px;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.theme-toggle:hover{border-color:#93c5fd;background:var(--bg-hover,#f8fafc)}

/* === Confidence Section === */
.confidence-section{margin-top:20px;padding:20px 24px;background:var(--bg-card,#fff);border:1px solid var(--border,#e5e7eb);border-radius:14px}
.confidence-section h4{font-size:14px;font-weight:700;color:var(--text-primary,#111827);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.confidence-meter{background:var(--bg-active,#f3f4f6);border-radius:8px;height:28px;overflow:hidden;position:relative}
.confidence-meter .meter-bar{height:100%;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;transition:width .6s ease;min-width:40px}
.confidence-text{font-size:13px;font-weight:600;margin-top:8px;color:var(--text-primary,#111827)}
.confidence-detail{font-size:12px;color:var(--text-muted,#9ca3af);margin-top:4px}
.confidence-factors{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px}
.confidence-factor{background:var(--bg-card-alt,#f9fafb);border:1px solid var(--border-light,#f3f4f6);border-radius:10px;padding:10px 12px;text-align:center}
.confidence-factor .cf-label{font-size:10px;color:var(--text-muted,#9ca3af);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.confidence-factor .cf-value{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
/* === Reset & Base === */
*{margin:0;padding:0;box-sizing:border-box}
html{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;font-feature-settings:'tnum';-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{background:#f8f9fa;color:#111827;font-size:14px;min-height:100vh;line-height:1.5}
a{color:#1e40af;text-decoration:none}

/* === Animations === */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateX(80px);opacity:0}to{transform:none;opacity:1}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:calc(200px + 100%) 0}}
.fade-in{animation:fadeIn .25s ease-out}

/* === Top Nav === */
.topnav{background:#fff;position:sticky;top:0;z-index:50;box-shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06)}
.topnav-inner{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;height:56px;gap:12px}
.topnav .logo{font-weight:800;font-size:18px;color:#1e40af;white-space:nowrap;cursor:pointer;letter-spacing:-.4px;display:flex;align-items:center;gap:6px;transition:opacity .15s}
.topnav .logo:hover{opacity:.8}
.topnav .logo-icon{font-size:22px;line-height:1}
.topnav .nav-links{display:flex;gap:2px;margin-left:auto;position:relative}
.topnav .nav-links a{padding:8px 16px;font-size:13px;color:#6b7280;border-radius:8px;transition:all .2s ease;font-weight:500;position:relative}
.topnav .nav-links a:hover{background:#f3f4f6;color:#111827}
.topnav .nav-links a.active{color:#1e40af;font-weight:600;background:transparent}
.topnav .nav-links a.active::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:24px;height:2px;background:#1e40af;border-radius:1px;animation:fadeIn .2s ease-out}
.topnav .user-info{font-size:12px;color:#9ca3af;margin-left:8px;white-space:nowrap;font-weight:500}
.topnav .logout-btn{font-size:12px;color:#6b7280;background:#f9fafb;border:1px solid #e5e7eb;padding:6px 14px;border-radius:8px;cursor:pointer;transition:all .15s;font-weight:500}
.topnav .logout-btn:hover{color:#dc2626;border-color:#fca5a5;background:#fef2f2}
.topnav .logout-btn:active{transform:scale(.98)}

/* === Layout === */
.container{max-width:1200px;margin:0 auto;padding:24px}

/* === Date Tabs === */
.date-tabs{display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.date-tab{padding:10px 20px;font-size:13px;font-weight:600;color:#6b7280;cursor:pointer;border:none;background:#fff;transition:all .2s ease;text-align:center;border-radius:24px;border:1px solid #e5e7eb;white-space:nowrap}
.date-tab:hover{border-color:#93c5fd;color:#1e40af;background:#eff6ff}
.date-tab:active{transform:scale(.98)}
.date-tab.active{color:#fff;background:#1e40af;border-color:#1e40af;box-shadow:0 2px 8px rgba(30,64,175,.25)}
.date-tab-custom{display:flex;align-items:center;margin-left:auto}
.date-tab-custom input{border:1px solid #e5e7eb;border-radius:10px;padding:8px 14px;font-size:12px;width:150px;color:#374151;transition:all .15s}
.date-tab-custom input:focus{outline:none;border-color:#93c5fd;box-shadow:0 0 0 3px rgba(30,64,175,.1)}

/* === Grade Filter === */
.grade-bar{display:flex;gap:6px;padding:12px 0;flex-wrap:wrap}
.grade-pill{padding:6px 14px;font-size:12px;border-radius:20px;cursor:pointer;border:1px solid #e5e7eb;background:#fff;color:#6b7280;transition:all .2s ease;white-space:nowrap;font-weight:500}
.grade-pill:hover{border-color:#93c5fd;color:#1e40af;background:#eff6ff}
.grade-pill:active{transform:scale(.97)}
.grade-pill.active{background:#1e40af;color:#fff;border-color:#1e40af;box-shadow:0 2px 6px rgba(30,64,175,.2)}
.grade-pill .cnt{font-size:10px;opacity:.65;margin-left:3px}

/* === Venue Section === */
.venue-section{margin-top:12px;background:#fff;border-radius:12px;border:1px solid #e5e7eb;overflow:hidden;transition:box-shadow .2s}
.venue-section:hover{box-shadow:0 2px 8px rgba(0,0,0,.04)}
.venue-header{font-size:13px;font-weight:700;padding:12px 20px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:8px}
.venue-header::before{content:'';display:inline-block;width:4px;height:18px;border-radius:2px}
/* Venue color coding */
.venue-section[data-venue="中京"] .venue-header{color:#1e40af;background:#eff6ff}
.venue-section[data-venue="中京"] .venue-header::before{background:#1e40af}
.venue-section[data-venue="中山"] .venue-header{color:#059669;background:#ecfdf5}
.venue-section[data-venue="中山"] .venue-header::before{background:#059669}
.venue-section[data-venue="阪神"] .venue-header{color:#dc2626;background:#fef2f2}
.venue-section[data-venue="阪神"] .venue-header::before{background:#dc2626}
.venue-section[data-venue="東京"] .venue-header{color:#7c3aed;background:#f5f3ff}
.venue-section[data-venue="東京"] .venue-header::before{background:#7c3aed}
.venue-section[data-venue="京都"] .venue-header{color:#d97706;background:#fffbeb}
.venue-section[data-venue="京都"] .venue-header::before{background:#d97706}
.venue-section[data-venue="小倉"] .venue-header{color:#0891b2;background:#ecfeff}
.venue-section[data-venue="小倉"] .venue-header::before{background:#0891b2}
.venue-section[data-venue="新潟"] .venue-header{color:#16a34a;background:#f0fdf4}
.venue-section[data-venue="新潟"] .venue-header::before{background:#16a34a}
.venue-section[data-venue="福島"] .venue-header{color:#ea580c;background:#fff7ed}
.venue-section[data-venue="福島"] .venue-header::before{background:#ea580c}
.venue-section[data-venue="函館"] .venue-header{color:#4f46e5;background:#eef2ff}
.venue-section[data-venue="函館"] .venue-header::before{background:#4f46e5}
.venue-section[data-venue="札幌"] .venue-header{color:#0d9488;background:#f0fdfa}
.venue-section[data-venue="札幌"] .venue-header::before{background:#0d9488}
/* Default venue colors */
.venue-header{color:#1e40af;background:#f8fafc}
.venue-header::before{background:#1e40af}

/* === Race Rows === */
.race-row{display:flex;align-items:center;padding:12px 20px;border-bottom:1px solid #f3f4f6;cursor:pointer;transition:all .15s ease;gap:12px;font-size:13px}
.race-row:last-child{border-bottom:none}
.race-row:hover{background:#f8fafc}
.race-row:active{background:#f3f4f6}
.race-row.selected{background:#eff6ff;border-left:3px solid #1e40af;padding-left:17px}
.race-row .rnum{font-weight:700;color:#1e40af;min-width:36px;font-size:15px;font-variant-numeric:tabular-nums}
.race-row .rname{flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#111827}
.race-row .rmeta{color:#9ca3af;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.race-row .rhorses{color:#6b7280;font-size:11px;white-space:nowrap;background:#f3f4f6;padding:3px 10px;border-radius:12px;font-weight:500}

/* === Grade Badge === */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;color:#fff;margin-left:8px;vertical-align:middle;letter-spacing:.5px}
.badge-g1{background:linear-gradient(135deg,#dc2626,#ef4444)}.badge-g2{background:linear-gradient(135deg,#1e40af,#3b82f6)}.badge-g3{background:linear-gradient(135deg,#059669,#34d399)}
.badge-op{background:linear-gradient(135deg,#7c3aed,#a78bfa)}.badge-default{background:#6b7280}

/* === Prediction Box === */
.pred-box{margin-top:24px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);animation:fadeIn .3s ease-out}
.pred-header{background:linear-gradient(135deg,#1e3a8a,#1e40af,#2563eb);padding:20px 24px;color:#fff}
.pred-header h2{font-size:18px;font-weight:700;letter-spacing:-.2px}
.pred-header p{font-size:12px;opacity:.8;margin-top:4px;font-weight:400}

/* === Table === */
.table-outer{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
thead th{background:#f8f9fa;padding:12px 12px;font-size:11px;font-weight:700;color:#6b7280;text-align:center;border-bottom:2px solid #e5e7eb;cursor:pointer;user-select:none;white-space:nowrap;text-transform:uppercase;letter-spacing:.4px;transition:all .15s}
thead th:hover{color:#1e40af;background:#eff6ff}
thead th .arrow{font-size:10px;margin-left:2px;color:#d1d5db;transition:color .15s}
thead th .arrow.on{color:#1e40af}
tbody tr{border-bottom:1px solid #f3f4f6;transition:all .12s ease}
tbody tr:nth-child(even){background:#fafbfc}
tbody tr:hover{background:#eff6ff}
tbody td{padding:10px 12px;font-size:13px;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
tbody td.left{text-align:left}

/* === Rank Highlights === */
.rank-cell{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;font-weight:800;font-size:15px;line-height:1}
.rank-cell.r1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#78350f;box-shadow:0 2px 6px rgba(245,158,11,.3)}
.rank-cell.r2{background:linear-gradient(135deg,#d1d5db,#9ca3af);color:#374151;box-shadow:0 2px 6px rgba(156,163,175,.3)}
.rank-cell.r3{background:linear-gradient(135deg,#f59e0b,#d97706);color:#78350f;box-shadow:0 2px 6px rgba(217,119,6,.3)}
.rank-cell.r-other{background:#f3f4f6;color:#6b7280;font-size:13px;font-weight:600}

tr.rank-1{background:linear-gradient(90deg,#fffbeb,#fefce8) !important}
tr.rank-2{background:linear-gradient(90deg,#f9fafb,#f3f4f6) !important}
tr.rank-3{background:linear-gradient(90deg,#fffbeb,#fef9c3) !important}
tr.rank-top3 td{font-weight:600}

/* === Probability Bar === */
.prob-cell{position:relative;padding-right:4px}
.prob-bar-bg{position:absolute;left:0;top:0;height:100%;opacity:.1;border-radius:0;pointer-events:none;transition:width .3s ease}
.prob-bar-track{display:flex;align-items:center;gap:6px;justify-content:center}
.prob-bar-inline{display:inline-block;height:6px;border-radius:3px;vertical-align:middle;min-width:3px;max-width:60px;transition:width .3s ease}
.prob-text{font-variant-numeric:tabular-nums}

/* === Diff Column === */
.diff-val{font-size:11px;color:#9ca3af;font-variant-numeric:tabular-nums}
.diff-val.top{color:#059669;font-weight:700}

/* === Rank 95% CI visualization === */
.rank-ci-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px}
.rank-ci-track{position:relative;width:56px;height:4px;background:#e5e7eb;border-radius:2px;overflow:hidden}
.rank-ci-bar{position:absolute;top:0;height:100%;background:linear-gradient(90deg,#93c5fd,#3b82f6);border-radius:2px;opacity:.75;z-index:2}
.rank-ci-bar-outer{position:absolute;top:0;height:100%;background:#cbd5e1;border-radius:2px;opacity:.5;z-index:1}
.rank-ci-dot{position:absolute;top:-2px;width:8px;height:8px;border-radius:50%;background:#1e40af;border:1.5px solid #fff;transform:translateX(-50%);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.rank-ci-range{font-size:10px;color:#6b7280;font-variant-numeric:tabular-nums;line-height:1}

/* === EV with uncertainty === */
.ev-main{font-variant-numeric:tabular-nums;line-height:1.1}
.ev-unc{font-size:10px;color:#9ca3af;font-variant-numeric:tabular-nums;display:block;margin-top:1px}
.ev-unc.wide{color:#dc2626}

/* === Admin Panel === */
.admin-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.admin-card.halted{border:2px solid #dc2626;background:linear-gradient(135deg,#fff,#fef2f2)}
.admin-card h3{margin:0 0 12px 0;font-size:15px;font-weight:700;color:#111827}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;font-size:13px}
.admin-grid>div{display:flex;justify-content:space-between;padding:8px 10px;background:#f9fafb;border-radius:6px;border:1px solid #f3f4f6}
.admin-grid .k{color:#6b7280;font-size:12px}
.admin-grid .v{color:#111827;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.admin-grid .v.warn{color:#dc2626}
.admin-grid .v small{color:#9ca3af;font-weight:400;margin-left:3px}
.admin-status{padding:4px 10px;border-radius:12px;font-size:12px;font-weight:700}
.admin-status.good{background:#dcfce7;color:#15803d}
.admin-status.bad{background:#fee2e2;color:#dc2626}
.halt-banner{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:12px}

/* === Race Nav === */
.race-nav{display:flex;gap:8px;margin-top:16px;justify-content:center;align-items:center}
.race-nav button{background:#fff;border:1px solid #e5e7eb;padding:8px 20px;border-radius:10px;font-size:12px;cursor:pointer;color:#6b7280;transition:all .15s;font-weight:500}
.race-nav button:hover{border-color:#1e40af;color:#1e40af;background:#eff6ff}
.race-nav button:active{transform:scale(.98)}
.race-nav button:disabled{opacity:.35;cursor:not-allowed}
.race-nav .race-counter{font-size:12px;color:#9ca3af;padding:8px 4px;font-weight:500;font-variant-numeric:tabular-nums}

/* === Start Time === */
.start-time{font-size:10px;color:#9ca3af;background:#f3f4f6;padding:2px 8px;border-radius:6px;margin-left:4px;font-weight:500}

/* === Loading === */
.spinner{border:3px solid #e5e7eb;border-top:3px solid #1e40af;border-radius:50%;width:28px;height:28px;animation:spin .7s linear infinite;margin:24px auto}
.loading-box{text-align:center;padding:60px 0;animation:fadeIn .2s ease-out}
.loading-box p{font-size:13px;color:#9ca3af;margin-top:12px;font-weight:400}
/* Skeleton loading */
.skeleton{background:linear-gradient(90deg,#f3f4f6 25%,#e5e7eb 50%,#f3f4f6 75%);background-size:200px 100%;animation:shimmer 1.5s infinite;border-radius:8px;height:16px}

/* === Toast === */
.toast{position:fixed;top:20px;right:20px;padding:14px 24px;border-radius:12px;z-index:999;font-size:13px;color:#fff;animation:slideIn .25s ease-out;box-shadow:0 8px 24px rgba(0,0,0,.15);font-weight:500;backdrop-filter:blur(8px)}

/* === Login === */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f8f9fa 0%,#eff6ff 50%,#f8f9fa 100%)}
.login-card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:48px 40px;width:400px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.08);animation:fadeIn .4s ease-out}
.login-card h1{font-size:24px;font-weight:800;text-align:center;color:#1e40af;margin-bottom:4px;letter-spacing:-.3px}
.login-card .sub{font-size:12px;color:#9ca3af;text-align:center;margin-bottom:32px;font-weight:400}
.login-card label{display:block;font-size:12px;color:#6b7280;margin-bottom:6px;margin-top:20px;font-weight:600;letter-spacing:.2px}
.login-card input{width:100%;border:1px solid #e5e7eb;border-radius:10px;padding:12px 16px;font-size:14px;transition:all .2s;color:#111827;background:#f9fafb}
.login-card input:focus{outline:none;border-color:#93c5fd;box-shadow:0 0 0 3px rgba(30,64,175,.08);background:#fff}
.login-card button{width:100%;background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff;border:none;padding:14px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:28px;transition:all .2s;letter-spacing:.2px}
.login-card button:hover{box-shadow:0 4px 16px rgba(30,64,175,.3);transform:translateY(-1px)}
.login-card button:active{transform:translateY(0);box-shadow:0 2px 8px rgba(30,64,175,.2)}
.login-card .err{color:#dc2626;font-size:12px;margin-top:12px;display:none;background:#fef2f2;padding:10px 14px;border-radius:10px;border:1px solid #fecaca}

/* === Stat Cards === */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;text-align:center;transition:all .2s ease}
.stat-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.05);transform:translateY(-2px)}
.stat-card .label{font-size:11px;color:#9ca3af;margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat-card .value{font-size:28px;font-weight:800;color:#111827;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat-card .value.blue{color:#1e40af}
.stat-card .value.green{color:#059669}
.stat-card .value.red{color:#dc2626}

/* === Recommend Section === */
.rec-section-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:#111827}
.rec-section-title .rec-icon{font-size:20px}
.rec-section{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:28px}
.rec-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;transition:all .2s ease;position:relative;overflow:hidden}
.rec-card:hover{box-shadow:0 8px 24px rgba(0,0,0,.06);transform:translateY(-2px)}
.rec-card .rec-type-bar{position:absolute;top:0;left:0;right:0;height:3px}
.rec-card .rec-label{font-size:12px;font-weight:700;margin-bottom:12px;display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:8px}
.rec-card .rec-label.tansho{background:#fef2f2;color:#dc2626}
.rec-card .rec-label.fukusho{background:#eff6ff;color:#1e40af}
.rec-card .rec-label.umaren{background:#fef2f2;color:#dc2626}
.rec-card .rec-label.sanrenpuku{background:#fefce8;color:#a16207}
.rec-card .rec-label.wide{background:#ecfdf5;color:#059669}
.rec-card .rec-value{font-size:15px;font-weight:700;line-height:1.8;color:#111827}
.rec-card .rec-ev{font-size:11px;color:#9ca3af;margin-top:8px;font-weight:400}
.rec-card .confidence{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;margin-top:8px}
.conf-high{background:#ecfdf5;color:#059669}.conf-mid{background:#fffbeb;color:#d97706}.conf-low{background:#f3f4f6;color:#9ca3af}
/* Confidence bar */
.conf-meter{height:4px;border-radius:2px;background:#e5e7eb;margin-top:8px;overflow:hidden}
.conf-meter-fill{height:100%;border-radius:2px;transition:width .5s ease}

/* === No Odds Notice === */
.no-odds-note{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px 16px;font-size:12px;color:#d97706;margin-top:16px;font-weight:500}

/* === Settings === */
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.settings-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:24px}
.settings-card h3{font-size:14px;font-weight:700;margin-bottom:16px;color:#111827}
.settings-card input{width:100%;border:1px solid #e5e7eb;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:10px;transition:all .15s;color:#111827;background:#f9fafb}
.settings-card input:focus{outline:none;border-color:#93c5fd;box-shadow:0 0 0 3px rgba(30,64,175,.08);background:#fff}
.settings-card .btn{background:#1e40af;color:#fff;border:none;padding:10px 24px;border-radius:10px;font-size:13px;cursor:pointer;font-weight:600;transition:all .15s}
.settings-card .btn:hover{background:#1e3a8a;box-shadow:0 2px 8px rgba(30,64,175,.2)}
.settings-card .btn:active{transform:scale(.98)}
.settings-card .btn-danger{background:#dc2626}
.settings-card .btn-danger:hover{background:#b91c1c}
.empty{text-align:center;padding:60px;color:#9ca3af;font-size:14px}

/* === History Table === */
.table-wrap{overflow-x:auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px}

/* === Results === */
.results-box{margin-top:20px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden}
.results-header{background:linear-gradient(135deg,#059669,#34d399);padding:16px 24px;color:#fff}
.results-header h3{font-size:15px;font-weight:700}
.result-hit{color:#059669;font-weight:700}.result-miss{color:#dc2626;font-weight:600}

/* === Best Bets Section === */
.bb-section{margin-bottom:20px;animation:fadeIn .3s ease-out}
.bb-wrapper{background:linear-gradient(135deg,#0f172a,#1e293b,#1e3a8a);border-radius:16px;padding:24px;border:1px solid rgba(255,255,255,.08)}
.bb-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.bb-header h3{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.2px}
.bb-header .bb-count{font-size:12px;color:rgba(255,255,255,.5);font-weight:400}
.bb-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bb-card{background:rgba(255,255,255,.07);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px;transition:all .2s ease;cursor:pointer;position:relative;overflow:hidden}
.bb-card:hover{background:rgba(255,255,255,.12);box-shadow:0 8px 24px rgba(0,0,0,.2);transform:translateY(-3px);border-color:rgba(255,255,255,.2)}
.bb-card .bb-rank{position:absolute;top:0;left:0;font-size:12px;font-weight:800;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:0 0 10px 0}
.bb-card .bb-rank{background:rgba(255,255,255,.15);color:rgba(255,255,255,.7)}
.bb-card .bb-rank.r1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#78350f}
.bb-card .bb-rank.r2{background:linear-gradient(135deg,#d1d5db,#9ca3af);color:#374151}
.bb-card .bb-rank.r3{background:linear-gradient(135deg,#f59e0b,#d97706);color:#78350f}
.bb-card .bb-venue{font-size:11px;color:rgba(255,255,255,.45);margin-bottom:4px;padding-left:32px;font-weight:400}
.bb-card .bb-race{font-size:13px;font-weight:700;color:rgba(255,255,255,.9);margin-bottom:8px}
.bb-card .bb-horse{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bb-card .bb-horse .bb-num{background:rgba(255,255,255,.15);color:#fff;font-size:12px;font-weight:700;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.bb-card .bb-horse .bb-name{font-size:15px;font-weight:700;color:#fff}
.bb-card .bb-stats{display:flex;gap:8px;flex-wrap:wrap}
.bb-card .bb-stat{font-size:11px;color:rgba(255,255,255,.45)}
.bb-card .bb-stat b{color:rgba(255,255,255,.8)}
.bb-card .bb-rec{margin-top:8px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;display:inline-block}
.bb-card .bb-rec.strong{background:rgba(5,150,105,.25);color:#6ee7b7}
.bb-card .bb-rec.rec{background:rgba(59,130,246,.25);color:#93c5fd}
.bb-card .bb-rec.maybe{background:rgba(245,158,11,.2);color:#fcd34d}
.bb-card .bb-rec.skip{background:rgba(255,255,255,.1);color:rgba(255,255,255,.4)}
.bb-loading{text-align:center;padding:24px;color:rgba(255,255,255,.4);font-size:13px}

/* === Action Buttons === */
.action-row{margin-top:12px;display:flex;gap:8px;justify-content:flex-end}
.action-btn{background:#fff;border:1px solid #e5e7eb;padding:8px 16px;border-radius:10px;font-size:12px;cursor:pointer;color:#6b7280;transition:all .15s;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.action-btn:hover{border-color:#93c5fd;color:#1e40af;background:#eff6ff}
.action-btn:active{transform:scale(.98)}

/* === Spread Notice === */
.spread-notice{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 16px;font-size:12px;color:#d97706;margin:12px 24px 0;font-weight:500}

/* === Bottom Tab Bar === */
.bottom-tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#fff;border-top:1px solid #e5e7eb;display:none;justify-content:space-around;align-items:stretch;padding:0;padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.bottom-tab-bar .tab-item{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:48px;min-width:48px;padding:6px 4px;flex:1;cursor:pointer;color:#9ca3af;font-size:10px;font-weight:600;transition:color .15s;text-decoration:none;-webkit-tap-highlight-color:transparent;border:none;background:transparent}
.bottom-tab-bar .tab-item:active{background:#f3f4f6}
.bottom-tab-bar .tab-item.active{color:#1e40af}
.bottom-tab-bar .tab-icon{font-size:22px;line-height:1;margin-bottom:2px}
.bottom-tab-bar .tab-label{font-size:10px;line-height:1.2}

/* === Mobile Horse Cards === */
.mobile-cards-wrap{display:none}
.mobile-horse-card{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;flex-wrap:wrap}
.mobile-horse-card:active{background:#f8fafc}
.mobile-horse-card.expanded{border-color:#93c5fd;box-shadow:0 2px 8px rgba(30,64,175,.08)}
.mobile-horse-card .horse-rank{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;background:#f3f4f6;color:#6b7280}
.mobile-horse-card .horse-rank.r1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#78350f;box-shadow:0 2px 6px rgba(245,158,11,.3)}
.mobile-horse-card .horse-rank.r2{background:linear-gradient(135deg,#d1d5db,#9ca3af);color:#374151}
.mobile-horse-card .horse-rank.r3{background:linear-gradient(135deg,#f59e0b,#d97706);color:#78350f}
.mobile-horse-card .horse-main{flex:1;min-width:0}
.mobile-horse-card .horse-name{font-size:14px;font-weight:700;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mobile-horse-card .horse-prob{font-size:12px;color:#6b7280;margin-top:2px}
.mobile-horse-card .horse-rec{font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;white-space:nowrap;flex-shrink:0}
.mobile-horse-card .horse-rec.rec-strong{background:#fef2f2;color:#dc2626}
.mobile-horse-card .horse-rec.rec-buy{background:#eff6ff;color:#1e40af}
.mobile-horse-card .horse-rec.rec-maybe{background:#ecfdf5;color:#059669}
.mobile-horse-card .horse-rec.rec-none{background:#f3f4f6;color:#9ca3af}
.mobile-horse-card .horse-details{display:none;width:100%;margin-top:10px;padding-top:10px;border-top:1px solid #f3f4f6}
.mobile-horse-card.expanded .horse-details{display:block}
.mobile-horse-card .horse-details .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mobile-horse-card .horse-details .detail-item{font-size:12px;color:#6b7280}
.mobile-horse-card .horse-details .detail-item b{color:#111827}

/* === Bet Slip Copy Button === */
.bet-copy-btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff;border:none;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;min-height:44px;margin-top:12px;-webkit-tap-highlight-color:transparent}
.bet-copy-btn:hover{box-shadow:0 4px 12px rgba(30,64,175,.3);transform:translateY(-1px)}
.bet-copy-btn:active{transform:scale(.98)}

/* === Responsive === */
@media(max-width:600px){
  .topnav .nav-links{display:none}
  .topnav .logout-btn{display:none}
  .bottom-tab-bar{display:flex}
  body{padding-bottom:64px}
  .topnav-inner{gap:6px;padding:0 12px;height:50px}
  .topnav .logo{font-size:15px}
  .topnav .logo-icon{font-size:18px}
  .topnav .user-info{display:none}
  .container{padding:16px;padding-bottom:80px}
  .date-tabs{gap:6px;flex-direction:column}
  .date-tab{padding:10px 14px;font-size:13px;min-height:44px}
  .date-tab-custom{display:flex !important;margin-left:0;width:100%}
  .date-tab-custom input{width:100%;padding:12px 14px;font-size:14px;min-height:44px}
  .rec-section{grid-template-columns:1fr}
  /* Hide table, show cards on mobile */
  .table-outer{display:none}
  .mobile-cards-wrap{display:block}
  .bb-cards{grid-template-columns:1fr}
  .bb-wrapper{padding:16px}
  .pred-header{padding:16px 20px}
  .pred-header h2{font-size:16px}
  /* Bigger touch targets */
  .race-row{padding:14px 16px;min-height:48px;gap:10px;font-size:14px}
  .race-row .rnum{font-size:16px}
  .race-row .rname{font-size:14px}
  .grade-pill{padding:10px 16px;font-size:13px;min-height:44px;display:flex;align-items:center}
  /* Race nav full-width buttons */
  .race-nav{flex-direction:column;gap:10px}
  .race-nav button{width:100%;min-height:48px;padding:14px 20px;font-size:14px;font-weight:600}
  .race-nav .race-counter{order:-1;font-size:14px}
  /* Action buttons bigger */
  .action-row{flex-direction:column}
  .action-btn{min-height:44px;padding:12px 20px;font-size:14px;justify-content:center;width:100%}
  /* Settings responsive */
  .settings-card .btn{min-height:44px;padding:12px 24px;font-size:14px}
  .settings-card input{min-height:44px;padding:12px 14px;font-size:14px}
  /* Stat cards */
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  /* Swipe hint */
  .swipe-hint{display:block;text-align:center;font-size:12px;color:#9ca3af;margin-top:8px;padding:4px}
}
@media(min-width:601px){
  .bottom-tab-bar{display:none !important}
  .mobile-cards-wrap{display:none !important}
  .swipe-hint{display:none}
}
@media(max-width:400px){
  .rank-cell{width:26px;height:26px;font-size:12px}
  .rank-cell.r1,.rank-cell.r2,.rank-cell.r3{font-size:13px}
  .stat-grid{grid-template-columns:1fr 1fr}
  .stat-card .value{font-size:22px}
}

/* === Performance Page === */
.perf-hero{background:linear-gradient(135deg,#1e3a8a,#1e40af,#2563eb);border-radius:16px;padding:40px 32px;color:#fff;text-align:center;margin-bottom:28px}
.perf-hero h1{font-size:26px;font-weight:800;letter-spacing:-.4px;margin-bottom:8px}
.perf-hero .perf-sub{font-size:14px;opacity:.85;margin-bottom:20px}
.perf-hero .perf-key{display:inline-block;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:14px 28px;font-size:18px;font-weight:700;letter-spacing:-.2px}
.perf-hero .perf-key .hl{color:#fbbf24}
.perf-section{margin-bottom:28px}
.perf-section h2{font-size:16px;font-weight:700;color:#111827;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.perf-tbl-wrap{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow-x:auto}
.perf-tbl{width:100%;border-collapse:collapse}

<body>
<div id="app"></div>
<script>
const API='/keiba/api';
const S={token:localStorage.getItem('token'),user:localStorage.getItem('username')||'',isAdmin:localStorage.getItem('isAdmin')==='1'};

async function apiFetch(path,opts={}){
  const token=localStorage.getItem('token');
  const res=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});
  if(res.status===401){
    const e=await res.json().catch(()=>({}));
    if(path==='/auth/login'){throw new Error(e.detail||'ユーザー名またはパスワードが正しくありません');}
    S.token=null;localStorage.removeItem('token');showLogin();throw new Error('ログインしてください');
  }
  if(res.status===429){const e=await res.json().catch(()=>({}));throw new Error(e.detail||'リクエストが多すぎます。しばらくお待ちください');}
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.detail||'サーバーエラー');}
  return res.json();
}

function toast(msg,type='info'){
  const bg=type==='error'?'#dc2626':type==='success'?'#059669':'#1e40af';
  const el=document.createElement('div');el.className='toast';el.style.background=bg;el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),3000);
}
function fmt(n,d=1){return n!=null&&!isNaN(n)&&n!==0?Number(n).toFixed(d):'-';}
function pct(n){if(n==null||isNaN(n)||n===0)return'-';const v=n*100;return v.toFixed(1)+'%';}
function _buildBetCards(w,wConf,wConfLabel,wConfPct,wConfColor,t3,t3Conf,t3ConfLabel,t3ConfPct,t3ConfColor,m2,m2raw,m3,m3raw,wide,wideRaw,hasOddsData,BK,_kelly,_betUnit,_pct,_fmt){
  // ケリー基準で比率を計算し、合計をBK(10000)に正規化
  var rawW=w?Math.max(_kelly(w.prob_win,w.odds),0):0;
  var rawF=t3.reduce(function(s,h){return s+Math.max(_kelly(h.prob_top3,h.odds>0?Math.max(h.odds*0.35,1.1):0)*0.6,0);},0);
  var m2Prob=m2raw.length>=2?(m2raw[0].prob_win*m2raw[1].prob_top3+m2raw[1].prob_win*m2raw[0].prob_top3):0;
  var m2Odds=m2raw.length>=2&&m2raw[0].odds>0&&m2raw[1].odds>0?Math.round(m2raw[0].odds*m2raw[1].odds*0.4):0;
  var rawM2=m2Odds>0?Math.max(_kelly(m2Prob,m2Odds)*0.5,0):0;
  var s3Prob=m3raw.length>=3?m3raw[0].prob_top3*m3raw[1].prob_top3*m3raw[2].prob_top3*6:0;
  var s3Odds=m3raw.length>=3&&m3raw[0].odds>0&&m3raw[1].odds>0&&m3raw[2].odds>0?Math.round(m3raw[0].odds*m3raw[1].odds*m3raw[2].odds*0.05):0;
  var rawS3=s3Odds>0?Math.max(_kelly(s3Prob,s3Odds)*0.3,0):0;
  var wdProb=wideRaw.length>=2?wideRaw[0].prob_top3*wideRaw[1].prob_top3:0;
  var wdOdds=wideRaw.length>=2&&wideRaw[0].odds>0&&wideRaw[1].odds>0?Math.max(Math.round((wideRaw[0].odds+wideRaw[1].odds)*0.25),1):0;
  var rawWd=wdOdds>0?Math.max(_kelly(wdProb,wdOdds)*0.5,0):0;
  var rawTotal=rawW+rawF+rawM2+rawS3+rawWd;
  // 合計10000円に正規化 (100円単位)
  function alloc(raw){if(!hasOddsData||rawTotal<=0)return 0;return Math.round(raw/rawTotal*BK/100)*100;}
  var wBet=alloc(rawW),fTotal=alloc(rawF),m2Bet=alloc(rawM2),s3Bet=alloc(rawS3),wdBet=alloc(rawWd);
  // 端数をwBetで調整して合計をBKに合わせる
  var sum5=wBet+fTotal+m2Bet+s3Bet+wdBet;
  if(hasOddsData&&sum5>0){var diff=BK-sum5;wBet=Math.max(0,wBet+diff);}
  var totalBet=wBet+fTotal+m2Bet+s3Bet+wdBet;
  // 回収額計算
  var wPay=w&&w.odds>0?Math.round(wBet*w.odds):0;
  var fBets=t3.map(function(h,i){var n=t3.length;var b=Math.round(fTotal/n/100)*100;if(i===0)b=fTotal-b*(n-1);return{b:b,pay:h.odds>0?Math.round(b*Math.max(h.odds*0.35,1.1)):0};});
  var fPayMin=fBets.reduce(function(s,x){return s+x.pay;},0);
  var m2Pay=Math.round(m2Bet*m2Odds);
  var s3Pay=Math.round(s3Bet*s3Odds);
  var wdPay=Math.round(wdBet*wdOdds);
  function bb(amt,pay){if(!hasOddsData||amt<=0)return'';return'<div style="margin-top:8px;padding:8px 12px;background:rgba(255,255,255,0.04);border-radius:8px;display:flex;justify-content:space-between;align-items:center;font-size:12px"><span style="color:#9ca3af">投資 <b style="color:#e4e4ef">\u00A5'+amt.toLocaleString()+'</b></span><span style="color:#9ca3af">回収 <b style="color:#34d399">\u00A5'+pay.toLocaleString()+'</b></span></div>';}
  var h='';
  h+='<div class="rec-card"><div class="rec-type-bar" style="background:linear-gradient(90deg,#dc2626,#ef4444)"></div><div class="rec-label tansho">&#127919; 単勝</div>';
  h+='<div class="rec-value">'+(w?'&#9678; <b>'+w.horse_number+'</b> '+w.horse_name:'-')+'</div>';
  h+='<div class="rec-ev">勝率 '+_pct(w?w.prob_win:0)+(w&&w.odds>0?' / オッズ '+_fmt(w.odds,1):'')+'</div>';
  h+='<span class="confidence conf-'+wConf+'">'+wConfLabel+'</span>';
  h+='<div class="conf-meter"><div class="conf-meter-fill" style="width:'+wConfPct+'%;background:'+wConfColor+'"></div></div>';
  h+=bb(wBet,wPay)+'</div>';
  h+='<div class="rec-card"><div class="rec-type-bar" style="background:linear-gradient(90deg,#1e40af,#3b82f6)"></div><div class="rec-label fukusho">&#128309; 複勝</div>';
  h+='<div class="rec-value">'+t3.map(function(x,i){var mk=i===0?'&#9678;':i===1?'&#9675;':'&#9650;';return mk+' <b>'+x.horse_number+'</b> '+x.horse_name+' <span style="color:#9ca3af;font-size:11px">'+_pct(x.prob_top3)+'</span>';}).join('<br>')+'</div>';
  h+='<span class="confidence conf-'+t3Conf+'">'+t3ConfLabel+'</span>';
  h+='<div class="conf-meter"><div class="conf-meter-fill" style="width:'+t3ConfPct+'%;background:'+t3ConfColor+'"></div></div>';
  h+=bb(fTotal,fPayMin)+'</div>';
  h+='<div class="rec-card"><div class="rec-type-bar" style="background:linear-gradient(90deg,#dc2626,#f87171)"></div><div class="rec-label umaren">&#128308; 馬連</div>';
  h+='<div class="rec-value">'+(m2.length>=2?'<b style="font-size:22px">'+m2[0].horse_number+'</b> <span style="color:#d1d5db;font-size:16px">&mdash;</span> <b style="font-size:22px">'+m2[1].horse_number+'</b>':'-')+'</div>';
  h+='<div class="rec-ev">'+(m2raw.length>=2?m2raw[0].horse_name+' \u00D7 '+m2raw[1].horse_name:'')+(m2Odds>0?' / 想定オッズ '+m2Odds:'')+'</div>';
  h+=bb(m2Bet,m2Pay)+'</div>';
  h+='<div class="rec-card"><div class="rec-type-bar" style="background:linear-gradient(90deg,#d97706,#fbbf24)"></div><div class="rec-label sanrenpuku">&#128993; 三連複</div>';
  h+='<div class="rec-value">'+(m3.length>=3?'<b style="font-size:22px">'+m3[0].horse_number+'</b> <span style="color:#d1d5db;font-size:16px">&mdash;</span> <b style="font-size:22px">'+m3[1].horse_number+'</b> <span style="color:#d1d5db;font-size:16px">&mdash;</span> <b style="font-size:22px">'+m3[2].horse_number+'</b>':'-')+'</div>';
  h+='<div class="rec-ev">'+(m3.length>=3?m3.map(function(x){return x.horse_name;}).join(' \u00D7 '):'')+(s3Odds>0?' / 想定オッズ '+s3Odds:'')+'</div>';
  h+=bb(s3Bet,s3Pay)+'</div>';
  h+='<div class="rec-card"><div class="rec-type-bar" style="background:linear-gradient(90deg,#059669,#34d399)"></div><div class="rec-label wide">&#128994; ワイド</div>';
  h+='<div class="rec-value">'+(wide.length>=2?'<b style="font-size:22px">'+wide[0].horse_number+'</b> <span style="color:#d1d5db;font-size:16px">&mdash;</span> <b style="font-size:22px">'+wide[1].horse_number+'</b>':'-')+'</div>';
  h+='<div class="rec-ev">'+(wideRaw.length>=2?wideRaw[0].horse_name+' \u00D7 '+wideRaw[1].horse_name:'')+(wdOdds>0?' / 想定オッズ '+wdOdds:'')+'</div>';
  h+=bb(wdBet,wdPay)+'</div>';
  if(hasOddsData&&totalBet>0){h+='<div style="margin-top:16px;padding:16px 20px;background:linear-gradient(135deg,rgba(30,64,175,0.15),rgba(5,150,105,0.1));border:1px solid rgba(59,130,246,0.2);border-radius:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px"><div style="font-size:14px;font-weight:700;color:#e4e4ef">合計投資 <span style="font-size:20px;color:#93c5fd">\u00A5'+totalBet.toLocaleString()+'</span></div><div style="font-size:12px;color:#9ca3af">\u00A5'+BK.toLocaleString()+' / ケリー基準で5券種に最適配分</div></div>';}
  return h;
}
function dateStr(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
function dayLabel(d){const days=['日','月','火','水','木','金','土'];return(d.getMonth()+1)+'/'+d.getDate()+'('+days[d.getDay()]+')';}

function getNextSat(){
  const d=new Date();
  const day=d.getDay();
  const diff=day===6?0:day===0?6:(6-day);
  d.setDate(d.getDate()+diff);
  return d;
}
function getNextSun(){
  const d=new Date();
  const day=d.getDay();
  const diff=day===0?0:7-day;
  d.setDate(d.getDate()+diff);
  return d;
}

function logout(){localStorage.clear();S.token=null;S.user='';S.isAdmin=false;showLogin();}

/* === Routing === */
let curPage='predict';
function goPage(id){curPage=id;location.hash=id;route();}
function route(){
  const h=location.hash.slice(1)||'predict';
  if(h==='performance'){curPage=h;renderPerformance();return;}
  if(h==='replay'){curPage=h;renderReplay();return;}
  if(!S.token||!localStorage.getItem('token')){showLogin();return;}
  curPage=h;
  const pages={home:renderHome,predict:renderPredict,history:renderHistory,settings:renderSettings,results:renderResults,admin:renderAdmin,focus:renderFocus};
  (pages[h]||renderPredict)();
}

function topNav(active){
  const tabMap={'home':'home','predict':'predict','results':'results','history':'results','performance':'performance','settings':'settings','replay':'replay'};
  const activeTab=tabMap[active]||'predict';
  return`<nav class="topnav"><div class="topnav-inner">
    <span class="logo" onclick="goPage('predict')"><span class="logo-icon">&#127943;</span> 競馬予測AI</span>
    <div class="nav-links">
      <a href="#" onclick="event.preventDefault();goPage('home')" class="${active==='home'?'active':''}">ホーム</a>
      <a href="#" onclick="event.preventDefault();goPage('predict')" class="${active==='predict'?'active':''}">レース予測</a>
      <a href="#" onclick="event.preventDefault();goPage('replay')" class="${active==='replay'?'active':''}">体験</a>
      <a href="#" onclick="event.preventDefault();goPage('results')" class="${active==='results'?'active':''}">結果</a>
      <a href="#" onclick="event.preventDefault();goPage('history')" class="${active==='history'?'active':''}">履歴</a>
      <a href="#" onclick="event.preventDefault();goPage('performance')" class="${active==='performance'?'active':''}">実績</a>
      <a href="#" onclick="event.preventDefault();goPage('settings')" class="${active==='settings'?'active':''}">設定</a>
      ${S.isAdmin?`<a href="#" onclick="event.preventDefault();goPage('admin')" class="${active==='admin'?'active':''}" style="color:#dc2626;font-weight:700">&#128737;&#65039; 管理</a>`:''}
    </div>
    <span class="user-info">${S.user}</span>
    <button class="theme-toggle" onclick="toggleTheme()" title="ダークモード切替" id="theme-toggle-btn">${isDarkMode()?'\u2600\uFE0F':'\u{1F319}'}</button>
    <button class="logout-btn" onclick="logout()">ログアウト</button>
  </div></nav>
  <nav class="bottom-tab-bar">
    <button class="tab-item ${activeTab==='home'?'active':''}" onclick="goPage('home')">
      <span class="tab-icon">&#127968;</span><span class="tab-label">ホーム</span>
    </button>
    <button class="tab-item ${activeTab==='predict'?'active':''}" onclick="goPage('predict')">
      <span class="tab-icon">&#127943;</span><span class="tab-label">予測</span>
    </button>
    <button class="tab-item ${activeTab==='replay'?'active':''}" onclick="goPage('replay')">
      <span class="tab-icon">&#127922;</span><span class="tab-label">体験</span>
    </button>
    <button class="tab-item ${activeTab==='results'?'active':''}" onclick="goPage('results')">
      <span class="tab-icon">&#128202;</span><span class="tab-label">結果</span>
    </button>
    <button class="tab-item ${activeTab==='settings'?'active':''}" onclick="goPage('settings')">
      <span class="tab-icon">&#9881;</span><span class="tab-label">設定</span>
    </button>
  </nav>`;
}

/* === Login === */
function showLogin(){
  document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="login-card">
    <h1>&#127943; 競馬予測AI</h1><p class="sub">v7.2-advanced 稼働中</p>
    <div id="lerr" class="err"></div>
    <label>ユーザー名</label><input id="lu" type="text" placeholder="ユーザー名を入力" autocomplete="username">
    <label>パスワード</label><input id="lp" type="password" placeholder="パスワードを入力" autocomplete="current-password">
    <button onclick="doLogin()">ログイン</button>
    <p style="text-align:center;margin-top:20px"><a href="#performance" onclick="event.preventDefault();goPage('performance')" style="font-size:13px;color:#6b7280;text-decoration:underline">&#128200; AI予測の実績を見る</a></p>
    <p style="text-align:center;margin-top:8px"><a href="#replay" onclick="event.preventDefault();goPage('replay')" style="font-size:13px;color:#7c3aed;text-decoration:underline">&#127922; 体験モード - 過去レースに挑戦</a></p>
  </div></div>`;
  setTimeout(()=>{
    document.getElementById('lp')?.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
    document.getElementById('lu')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('lp')?.focus();});
    document.getElementById('lu')?.focus();
  },50);
}

/* === Focus Mode (発走前・ワンタップ) === */
function _parseStartTime(s){
  if(!s)return null;
  const m=String(s).match(/(\d{1,2}):(\d{2})/);
  if(!m)return null;
  const d=new Date();
  d.setHours(parseInt(m[1],10),parseInt(m[2],10),0,0);
  return d;
}
async function renderFocus(){
  const $=document.getElementById('app');
  $.innerHTML=topNav('focus')+'<div class="container fade-in"><div class="loading-box"><div class="spinner"></div><p>直近のレースを検索中...</p></div></div>';
  try{
    const today=new Date();
    const ds=dateStr(today);
    const r=await apiFetch('/races/upcoming?date='+ds);
    const races=(r.races||r.data||[]);
    if(!races.length){
      $.innerHTML=topNav('focus')+`<div class="container fade-in"><div class="empty">本日のレースがありません<br><br><button onclick="goPage('predict')" style="background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff;border:none;padding:12px 28px;border-radius:10px;cursor:pointer;font-weight:600">レース予測へ</button></div></div>`;
      return;
    }
    const now=new Date();
    // 発走30分前〜発走後30分を「直近」と見なし、最も近い未発走レースを選ぶ
    let best=null,bestDelta=Infinity;
    for(const race of races){
      const st=_parseStartTime(race.start_time);
      if(!st)continue;
      const delta=st.getTime()-now.getTime();
      if(delta<-30*60*1000)continue;  // 30分以上過ぎたものは除外
      if(delta<bestDelta){bestDelta=delta;best=race;}
    }
    if(!best){
      $.innerHTML=topNav('focus')+`<div class="container fade-in"><div class="empty">本日の未発走レースはありません<br><br><button onclick="goPage('results')" style="background:#1e40af;color:#fff;border:none;padding:12px 28px;border-radius:10px;cursor:pointer;font-weight:600">結果を見る</button></div></div>`;
      return;
    }
    const minToGo=Math.round(bestDelta/60000);
    const statusColor=minToGo<=5?'#dc2626':minToGo<=15?'#d97706':'#059669';
    const statusLabel=minToGo<=0?'間もなく発走':minToGo<=5?'まもなく発走':minToGo<=15?'発走間近':'余裕あり';
    $.innerHTML=topNav('focus')+`<div class="container fade-in">
      <div style="background:linear-gradient(135deg,#111827,#1f2937);color:#fff;border-radius:16px;padding:24px;margin-bottom:20px">

        </div>
        <div style="font-size:14px;color:#d1d5db;margin-bottom:4px">${best.venue||''} ${best.race_number||''}R</div>
        <div style="font-size:22px;font-weight:800;line-height:1.3">${best.race_name||best.race_id||''}</div>
        <div style="margin-top:12px;display:flex;gap:16px;font-size:13px;color:#9ca3af">
          <span>&#128337; ${best.start_time||'--:--'}</span>
          <span style="color:${statusColor};font-weight:700">T-${minToGo>0?minToGo:0}分</span>
          ${best.course_info?`<span>${best.course_info}</span>`:''}
        </div>
      </div>
      <div id="focus-pred"><div class="loading-box"><div class="spinner"></div><p>AI予測を取得中... (10〜30秒)</p></div></div>
    </div>`;
    // 予測取得
    try{
      const d=await apiFetch('/upcoming/predict/race/'+best.race_id);
      const preds=d.predictions||d.horses||[];
      renderFocusPred(best,preds);
    }catch(e){
      const el=document.getElementById('focus-pred');
      if(el)el.innerHTML=`<div class="empty" style="color:#dc2626">予測エラー: ${e.message}</div>`;
    }
  }catch(e){
    $.innerHTML=topNav('focus')+`<div class="container fade-in"><div class="empty" style="color:#dc2626">エラー: ${e.message}</div></div>`;
  }
}

/* Grade filter definitions with proper mapping to grade field values */
const GRADE_FILTERS=[
  {key:'',label:'全て'},
  {key:'G1',label:'G1',match:g=>(/G1|GI(?!I)/i).test(g)},
  {key:'G2',label:'G2',match:g=>(/G2|GII(?!I)/i).test(g)},
  {key:'G3',label:'G3',match:g=>(/G3|GIII/i).test(g)},
  {key:'重賞',label:'重賞',match:g=>(/G1|G2|G3|GI|GII|GIII|重賞/i).test(g)},
  {key:'OP',label:'OP',match:g=>g.includes('OP')||g.includes('オープン')||g.includes('L')},
  {key:'条件戦',label:'条件戦',match:g=>g.includes('1勝')||g.includes('2勝')||g.includes('3勝')||g.includes('未勝利')||g.includes('新馬')||g.includes('1勝クラス')||g.includes('2勝クラス')||g.includes('3勝クラス')},
];

function gradeMatchesFilter(grade, filterKey){
  if(!filterKey) return true;
  const f=GRADE_FILTERS.find(x=>x.key===filterKey);
  if(!f||!f.match) return false;
  return f.match(grade||'');
}

function renderGradeBar(){
  const wrap=document.getElementById('grade-bar-wrap');
  if(!wrap||!PR.races.length){if(wrap)wrap.innerHTML='';return;}
  const cnt={};
  GRADE_FILTERS.forEach(g=>cnt[g.key]=0);
  PR.races.forEach(r=>{
    const g=r.info?.grade||r.info?.class_name||'';
    cnt['']++;
    GRADE_FILTERS.forEach(f=>{
      if(f.key&&f.match&&f.match(g)) cnt[f.key]++;
    });
  });
  const visible=GRADE_FILTERS.filter(g=>g.key===''||cnt[g.key]>0);
  // 信頼度フィルタ: 予測済みかつトップ馬 composite_score が閾値以上のレース数
  const scored=Object.keys(PR.raceScores||{}).length;
  const confCnt=PR.races.filter(r=>(PR.raceScores[r.id]||0)>=PR.confThreshold).length;
  const confBtn=scored>0?`<button class="grade-pill ${PR.confOnly?'active':''}" style="${PR.confOnly?'background:#065f46;color:#fff':''}" onclick="toggleConfOnly()" title="トップ馬スコアが${PR.confThreshold.toFixed(2)}以上のレースのみ">&#10024; 高信頼<span class="cnt">${confCnt}</span></button>`:'';
  wrap.innerHTML=`<div class="grade-bar">${visible.map(g=>
    `<button class="grade-pill ${PR.grade===g.key?'active':''}" onclick="filterGrade('${g.key}')">${g.label}<span class="cnt">${cnt[g.key]}</span></button>`
  ).join('')}${confBtn}</div>`;
}

window.toggleConfOnly=()=>{
  PR.confOnly=!PR.confOnly;PR.selId=null;
  applyFilters();
  renderGradeBar();renderRaces();
  const predArea=document.getElementById('pred-area');
  if(predArea)predArea.innerHTML='';
};

function applyFilters(){
  let arr=[...PR.races];
  if(PR.grade) arr=arr.filter(r=>gradeMatchesFilter(r.info?.grade||r.info?.class_name||'',PR.grade));
  if(PR.confOnly) arr=arr.filter(r=>(PR.raceScores[r.id]||0)>=PR.confThreshold);
  PR.filtered=arr;
}

window.filterGrade=(g)=>{
  PR.grade=g;PR.selId=null;
  applyFilters();
  renderGradeBar();renderRaces();
  const predArea=document.getElementById('pred-area');
  if(predArea)predArea.innerHTML='';
};

function gradeBadge(g){
  if(!g)return'';
  if(g.includes('G1')||g.includes('GI'))return`<span class="badge badge-g1">G1</span>`;
  if(g.includes('G2')||g.includes('GII'))return`<span class="badge badge-g2">G2</span>`;
  if(g.includes('G3')||g.includes('GIII'))return`<span class="badge badge-g3">G3</span>`;
  if(g.includes('OP')||g.includes('オープン'))return`<span class="badge badge-op">OP</span>`;
  return'';
}

/* Venue color helper */
function venueColor(v){
  const map={'中京':'#1e40af','中山':'#059669','阪神':'#dc2626','東京':'#7c3aed','京都':'#d97706','小倉':'#0891b2','新潟':'#16a34a','福島':'#ea580c','函館':'#4f46e5','札幌':'#0d9488'};
  return map[v]||'#1e40af';
}

function renderRaces(){
  const el=document.getElementById('race-area');
  if(!el)return;
  if(!PR.filtered.length){el.innerHTML='<div class="empty">該当するレースがありません</div>';return;}
  const byV={};
  PR.filtered.forEach(r=>{const v=r.info?.venue||'不明';(byV[v]=byV[v]||[]).push(r);});
  let h='';
  for(const[venue,races]of Object.entries(byV)){
    races.sort((a,b)=>(a.info?.race_number||0)-(b.info?.race_number||0));
    h+=`<div class="venue-section" data-venue="${venue}"><div class="venue-header">${venue} (${races.length}R)</div>`;
    races.forEach(r=>{
      const i=r.info||{};
      const rn=i.race_number||i.race_num||'';
      const rawName=i.race_name||r.id;
      const nameClean=rawName.replace(/^\d+R/,'').trim();
      const headMatch=nameClean.match(/(\d+)頭$/);
      const rname=nameClean.replace(/\d+頭$/,'').replace(/[ダ芝]\d+m$/,'').trim()||nameClean;
      const distMatch=nameClean.match(/(ダ|芝)(\d+)m/);
      const dist=i.course_info||((distMatch?distMatch[1]+distMatch[2]+'m':'')||(i.course_type||'')+(i.distance?i.distance+'m':''));
      const heads=i.horse_count||i.num_horses||(headMatch?headMatch[1]:'');
      const grade=i.grade||i.class_name||'';
      const sel=PR.selId===r.id?'selected':'';
      const isShiba=dist.includes('芝');
      const isDirt=dist.includes('ダ');
      const courseIcon=isShiba?'<span style="color:#059669;font-size:11px;font-weight:700;background:#ecfdf5;padding:2px 6px;border-radius:4px">芝</span>':isDirt?'<span style="color:#92400e;font-size:11px;font-weight:700;background:#fef3c7;padding:2px 6px;border-radius:4px">ダ</span>':'';
      const stime=i.start_time||'';
      h+=`<div class="race-row ${sel}" data-id="${r.id}" onclick="selectRace('${r.id}')">
        <span class="rnum">${rn}R</span>
        <span class="rname">${rname}${gradeBadge(grade)}</span>
        ${courseIcon}
        <span class="rmeta">${dist.replace(/^[ダ芝]/,'')}</span>
        ${heads?`<span class="rhorses">${heads}頭</span>`:''}
        ${stime?`<span class="start-time">${stime}</span>`:''}
      </div>`;
    });
    h+='</div>';
  }
  el.innerHTML=h;
}

window.selectRace=async(id)=>{
  if(PR.loading)return;
  PR.selId=id;PR.sortCol='predicted_rank';PR.sortDir='asc';
  document.querySelectorAll('.race-row').forEach(r=>{r.classList.toggle('selected',r.dataset.id===id);});
  const det=document.getElementById('pred-area');
  if(!det)return;
  PR.loading=true;
  const cached=predCache[id];
  if(cached&&(Date.now()-cached.ts)<600000){
    PR.preds=cached.preds;PR.raceInfo=cached.raceInfo;
    renderPred();
    PR.loading=false;
    det.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  det.innerHTML='<div class="loading-box"><div class="spinner"></div><p>出馬表取得中... (10〜30秒)</p></div>';
  det.scrollIntoView({behavior:'smooth',block:'start'});
  try{
    const d=await apiFetch('/upcoming/predict/race/'+id);
    PR.preds=d.predictions||d.horses||[];
    PR.raceInfo=d.race_info||{};
    predCache[id]={preds:PR.preds,raceInfo:PR.raceInfo,ts:Date.now()};
    renderPred();
    det.scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){
    det.innerHTML=`<div class="empty" style="color:#dc2626">予測エラー: ${e.message}</div>`;
  }
  PR.loading=false;
};

/* Color interpolation for probability visualization */
function probColor(val, min, max){
  if(max===min) return '#6b7280';
  const ratio=Math.max(0,Math.min(1,(val-min)/(max-min)));
  const hue=Math.round(120*ratio);
  const sat=ratio>0.5?'65%':'70%';
  const lit=ratio>0.7?'35%':ratio>0.3?'42%':'45%';
  return `hsl(${hue}, ${sat}, ${lit})`;
}

function renderPred(){
  const det=document.getElementById('pred-area');
  if(!det)return;
  if(!PR.preds.length){det.innerHTML='<div class="empty">予測データなし</div>';return;}

  const sorted=[...PR.preds].sort((a,b)=>{
    const col=PR.sortCol;
    if(col==='horse_name'||col==='recommended_bet'){
      const va=String(a[col]||''),vb=String(b[col]||'');
      return PR.sortDir==='asc'?va.localeCompare(vb,'ja'):vb.localeCompare(va,'ja');
    }
    const va=Number(a[col])||0,vb=Number(b[col])||0;
    return PR.sortDir==='asc'?va-vb:vb-va;
  });

  const allWin=PR.preds.map(p=>p.prob_win||0);
  const allT3=PR.preds.map(p=>p.prob_top3||0);
  const maxWin=Math.max(...allWin);
  const minWin=Math.min(...allWin);
  const maxT3=Math.max(...allT3);
  const minT3=Math.min(...allT3);
  const topWin=maxWin;

  const cols=[
    {k:'predicted_rank',l:'順位'},
    {k:'horse_number',l:'馬番'},
    {k:'horse_name',l:'馬名'},
    {k:'composite_score',l:'スコア'},
    {k:'prob_win',l:'勝率'},
    {k:'diff_win',l:'差'},
    {k:'prob_top3',l:'3着内率'},
    {k:'pred_position',l:'予測着順'},
    {k:'odds',l:'オッズ'},
    {k:'expected_value',l:'期待値'},
    {k:'recommended_bet',l:'推奨'}
  ];

  const arrow=(k)=>{
    if(PR.sortCol!==k)return'<span class="arrow">\u21C5</span>';
    return PR.sortDir==='asc'?'<span class="arrow on">\u25B2</span>':'<span class="arrow on">\u25BC</span>';
  };

  const hasOdds=PR.preds.some(p=>p.odds>0);
  const winSpread=(maxWin-minWin)*100;
  const isCloseProbs=winSpread<15;

  let rows='';
  sorted.forEach((p,idx)=>{
    const rank=p.predicted_rank||(idx+1);
    const rc=rank<=3?'rank-'+rank:'';
    const isTop3=rank<=3;

    // Rank cell with medal styling
    const rankCellCls=rank<=3?'r'+rank:'r-other';
    const rankDisplay=`<span class="rank-cell ${rankCellCls}">${rank}</span>`;

    const pw=p.prob_win||0;
    const pt=p.prob_top3||0;
    const pwPct=pct(p.prob_win);
    const ptPct=pct(p.prob_top3);

    const winColor=probColor(pw,minWin,maxWin);
    const t3Color=probColor(pt,minT3,maxT3);

    const winBarW=maxWin>0?Math.max(4,Math.round((pw/maxWin)*60)):0;
    const t3BarW=maxT3>0?Math.max(4,Math.round((pt/maxT3)*60)):0;

    const diffVal=topWin-pw;
    const diffStr=pw===topWin?'<span class="diff-val top">--</span>':`<span class="diff-val">-${(diffVal*100).toFixed(1)}%</span>`;

    const odds=p.odds>0?fmt(p.odds,1):'-';
    const ev=p.expected_value>0?fmt(p.expected_value,2):'-';
    const evStyle=p.expected_value>=1.5?'color:#059669;font-weight:700':p.expected_value>=1.0?'color:#d97706;font-weight:600':'color:#6b7280';
    const rec=p.recommended_bet||'-';
    const recColor=rec.includes('強く')?'#dc2626':rec.includes('推奨')||rec.includes('本命')?'#1e40af':rec.includes('複勝')||rec.includes('候補')?'#059669':'#9ca3af';

    // 予測着順セル: 80% CI を主表示、95% CI を外側に薄く描画
    let posCell;
    const posMain=p.pred_position!=null?fmt(p.pred_position,1):'-';
    const n=Math.max(PR.preds.length,1);
    const lo80=p.pred_rank_lower80, hi80=p.pred_rank_upper80;
    const lo95=p.pred_rank_lower95, hi95=p.pred_rank_upper95;
    const primary=lo80!=null&&hi80!=null?[lo80,hi80,'80%']:(lo95!=null&&hi95!=null?[lo95,hi95,'95%']:null);
    if(primary){
      const[lo,hi,tag]=primary;
      const center=(p.pred_position||((lo+hi)/2));
      const pctL=((lo-1)/Math.max(n-1,1))*100;
      const pctH=((hi-1)/Math.max(n-1,1))*100;
      const pctC=((center-1)/Math.max(n-1,1))*100;
      const w=Math.max(pctH-pctL,2);
      const outer=(lo95!=null&&hi95!=null&&(lo95<lo||hi95>hi))?`<div class="rank-ci-bar-outer" style="left:${((lo95-1)/Math.max(n-1,1))*100}%;width:${Math.max(((hi95-1)/Math.max(n-1,1))*100-((lo95-1)/Math.max(n-1,1))*100,2)}%"></div>`:'';
      const tip=lo95!=null?`${tag} CI: ${lo}〜${hi}位 / 95% CI: ${lo95}〜${hi95}位`:`${tag} CI: ${lo}〜${hi}位`;
      posCell=`<div class="rank-ci-wrap">
        <span style="font-size:13px;font-weight:600;color:#374151">${posMain}</span>
        <div class="rank-ci-track" title="${tip}">
          ${outer}
          <div class="rank-ci-bar" style="left:${pctL}%;width:${w}%"></div>
          <div class="rank-ci-dot" style="left:${Math.min(Math.max(pctC,0),100)}%"></div>
        </div>
        <span class="rank-ci-range">${lo}〜${hi}位</span>
      </div>`;
    } else {
      posCell=`<span style="color:#374151">${posMain}</span>`;
    }

    // 期待値セル: ev_std があれば ± uncertainty、ev_p25/p75 があれば範囲を表示
    let evCell;
    if(p.expected_value>0){
      let unc='';
      if(p.ev_std!=null && p.ev_std>0){
        const uncCls=(p.ev_std/Math.max(p.expected_value,0.01))>0.5?'ev-unc wide':'ev-unc';
        unc=`<span class="${uncCls}">±${fmt(p.ev_std,2)}</span>`;
      } else if(p.ev_p25!=null && p.ev_p75!=null){
        unc=`<span class="ev-unc">${fmt(p.ev_p25,2)}–${fmt(p.ev_p75,2)}</span>`;
      }
      evCell=`<span class="ev-main" style="${evStyle}">${ev}</span>${unc}`;
    } else {
      evCell=`<span style="${evStyle}">${ev}</span>`;
    }

    rows+=`<tr class="${rc} ${isTop3?'rank-top3':''}">
      <td>${rankDisplay}</td>
      <td style="font-weight:600;font-size:14px;color:#374151">${p.horse_number??'-'}</td>
      <td class="left" style="font-weight:${isTop3?'700':'500'};font-size:${isTop3?'14px':'13px'};color:#111827">${_favNames.has(p.horse_name)?'<span title="お気に入り" style="color:#f59e0b;margin-right:2px">&#11088;</span>':''}${p.horse_name||'-'}</td>
      <td style="font-weight:700;color:#1e40af;font-size:13px">${p.composite_score!=null?fmt(p.composite_score,3):'-'}</td>
      <td class="prob-cell">
        <div class="prob-bar-bg" style="width:${winBarW+20}px;background:${winColor}"></div>
        <div class="prob-bar-track">
          <span class="prob-text" style="color:${winColor};font-weight:${isTop3?'800':'600'};font-size:${isTop3?'14px':'13px'};position:relative">${pwPct}</span>
          <span class="prob-bar-inline" style="width:${winBarW}px;background:${winColor}"></span>
        </div>
      </td>
      <td>${diffStr}</td>
      <td class="prob-cell">
        <div class="prob-bar-bg" style="width:${t3BarW+20}px;background:${t3Color}"></div>
        <div class="prob-bar-track">
          <span class="prob-text" style="color:${t3Color};font-weight:${isTop3?'700':'500'};position:relative">${ptPct}</span>
          <span class="prob-bar-inline" style="width:${t3BarW}px;background:${t3Color}"></span>
        </div>
      </td>
      <td>${posCell}</td>
      <td style="color:#374151">${odds}</td>
      <td>${evCell}</td>
      <td><span style="color:${recColor};font-weight:600;font-size:12px">${rec}</span></td>
    </tr>`;
  });

  const info=PR.raceInfo;
  const raceR=PR.races.find(r=>r.id===PR.selId);
  const rNum=raceR?.info?.race_number||'';
  const venue=info.venue||raceR?.info?.venue||'';
  const title=venue+(rNum?rNum+'R ':' ')+(info.race_name||'');
  const meta=[info.course_type||info.course||'',info.distance?info.distance+'m':'',info.weather?'天候:'+info.weather:'',info.track_condition?'馬場:'+info.track_condition:''].filter(Boolean).join(' / ');

  const spreadNotice=isCloseProbs?`<div class="spread-notice">
    &#9888; 各馬の勝率差が小さい混戦レースです (差: ${winSpread.toFixed(1)}%) -- 色の濃淡と「差」列で相対的な優劣をご確認ください
  </div>`:'';

  // Betting recommendations
  const byWin=[...PR.preds].sort((a,b)=>(b.prob_win||0)-(a.prob_win||0));
  const byT3=[...PR.preds].sort((a,b)=>(b.prob_top3||0)-(a.prob_top3||0));
  const byS=[...PR.preds].sort((a,b)=>(b.composite_score||0)-(a.composite_score||0));
  const byPos=[...PR.preds].sort((a,b)=>(a.pred_position||99)-(b.pred_position||99));

  // 推奨金額計算 (bankroll=10000)
  const BK=10000;
  const _kelly=(prob,odds)=>{if(!odds||odds<=1||!prob)return 0;const f=(prob*odds-(1-prob))/Math.max(odds-1,0.01);return Math.max(0,Math.min(f,0.25));};
  const _betUnit=(frac)=>{const amt=Math.round(frac*BK/100)*100;return Math.max(0,Math.min(amt,BK));};
  const hasOddsData=PR.preds.some(p=>p.odds>0);

  const w=byWin[0];
  const wpct2=w?(w.prob_win*100):0;
  const wConf=wpct2>40?'high':wpct2>25?'mid':'low';
  const wConfLabel=wpct2>40?'信頼度 高':wpct2>25?'信頼度 中':'信頼度 低';
  const wConfPct=wpct2>40?85:wpct2>25?55:25;
  const wConfColor=wpct2>40?'#059669':wpct2>25?'#d97706':'#9ca3af';

  const t3=byT3.slice(0,3);
  const t3avg=t3.reduce((s,h)=>s+(h.prob_top3||0)*100,0)/3;
  const t3Conf=t3avg>60?'high':t3avg>45?'mid':'low';
  const t3ConfLabel=t3avg>60?'信頼度 高':t3avg>45?'信頼度 中':'信頼度 低';
  const t3ConfPct=t3avg>60?85:t3avg>45?55:25;
  const t3ConfColor=t3avg>60?'#059669':t3avg>45?'#d97706':'#9ca3af';

  const m2raw=byS.slice(0,2);
  const m2=[...m2raw].sort((a,b)=>(a.horse_number||0)-(b.horse_number||0));

  const m3raw=byS.slice(0,3);
  const m3=[...m3raw].sort((a,b)=>(a.horse_number||0)-(b.horse_number||0));

  const wideRaw=byT3.slice(0,2);
  const wide=[...wideRaw].sort((a,b)=>(a.horse_number||0)-(b.horse_number||0));

  // Build mobile cards
  let mobileCards='';
  const sortedForCards=[...PR.preds].sort((a,b)=>(a.predicted_rank||99)-(b.predicted_rank||99));
  sortedForCards.forEach(p=>{
    const rank=p.predicted_rank||99;
    const rankCls=rank<=3?'r'+rank:'';
    const pw=p.prob_win||0;
    const pt=p.prob_top3||0;

          </div>
        </div>

      ${rec!=='-'?`<div class="horse-rec ${recCls}">${rec}</div>`:''}
    </div>`;
  });

  // Build IPAT copy text
  const ipatVenue=venue;
  const ipatRNum=rNum?rNum+'R':'';
  const ipatRaceName=info.race_name||'';
  const ipatW=byWin[0];
  const ipatM2=[...byS.slice(0,2)].sort((a,b)=>(a.horse_number||0)-(b.horse_number||0));
  const ipatM3=[...byS.slice(0,3)].sort((a,b)=>(a.horse_number||0)-(b.horse_number||0));

  if(ipatM2.length>=2)ipatText+=`馬連: ${ipatM2[0].horse_number}-${ipatM2[1].horse_number}\n`;

  // Store for the copy function
  window._ipatText=ipatText;

  det.innerHTML=`
  <div class="pred-box">
    <div class="pred-header">
      <h2>${title}</h2>
      <p>${meta} &mdash; ${PR.preds.length}頭出走</p>

    <button class="bet-copy-btn" onclick="copyBetSlip()">&#128203; 買い目コピー</button>
    <button class="action-btn" onclick="window.print()">&#128424; 印刷</button>
  </div>
  ${!hasOdds?'<div class="no-odds-note">&#9888; オッズ未発表のため、期待値は計算できません。レース当日に再度ご確認ください。</div>':''}
  <div style="margin-top:28px">
    <div class="rec-section-title"><span class="rec-icon">&#127919;</span> おすすめの買い方</div>
    <div class="rec-section">
      ${_buildBetCards(w,wConf,wConfLabel,wConfPct,wConfColor,t3,t3Conf,t3ConfLabel,t3ConfPct,t3ConfColor,m2,m2raw,m3,m3raw,wide,wideRaw,hasOddsData,BK,_kelly,_betUnit,pct,fmt)}
    </div>
    <div style="margin-top:16px;text-align:center">
      <a href="https://www.jra.go.jp/dento/member/" target="_blank" rel="noopener noreferrer"
         style="display:inline-block;padding:10px 24px;background:linear-gradient(135deg,#059669,#34d399);color:#fff;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;transition:opacity .2s"
         onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">&#127919; \u99ac\u5238\u3092\u8cfc\u5165\u3059\u308b &rarr;</a>
      <a href="https://keiba.rakuten.co.jp/" target="_blank" rel="noopener noreferrer"
         style="display:inline-block;margin-left:12px;padding:10px 24px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#e4e4ef;border-radius:8px;font-size:14px;font-weight:500;text-decoration:none;transition:border-color .2s"
         onmouseover="this.style.borderColor='#059669'" onmouseout="this.style.borderColor='rgba(255,255,255,0.15)'">\u697d\u5929\u7af6\u99ac\u3067\u8cfc\u5165 &rarr;</a>
    </div>
  </div>
  ${buildConfidenceSection(PR.preds, PR.raceInfo)}`;

  // Prev/Next race navigation
  const curIdx=PR.filtered.findIndex(r=>r.id===PR.selId);
  const prevR=curIdx>0?PR.filtered[curIdx-1]:null;
  const nextR=curIdx<PR.filtered.length-1?PR.filtered[curIdx+1]:null;
  const navHtml=`<div class="race-nav">
    <button ${prevR?`onclick="selectRace('${prevR.id}')"`:'disabled'}>\u2190 前のレース</button>
    <span class="race-counter">${curIdx+1} / ${PR.filtered.length}</span>
    <button ${nextR?`onclick="selectRace('${nextR.id}')"`:'disabled'}>次のレース \u2192</button>
  </div>`;
  det.innerHTML+=navHtml;

  setTimeout(()=>det.scrollIntoView({behavior:'smooth',block:'start'}),100);
}

window.sortPred=(col)=>{
  if(PR.sortCol===col)PR.sortDir=PR.sortDir==='asc'?'desc':'asc';
  else{PR.sortCol=col;PR.sortDir=(col==='predicted_rank'||col==='pred_position'||col==='horse_number')?'asc':'desc';}
  renderPred();
};

        ).join('')}</div>
      </div>`;
    }

    let tableHtml='';
    if(preds.length>0){
      const rows=preds.slice(0,100).map(p=>{
        const date=(p.timestamp||p.date||p.created_at||'').substring(0,10);
        const raceId=p.race_id||'-';
        const top3=Array.isArray(p.top3)?p.top3:[];
        let horsesStr='-';
        if(top3.length>0){
          horsesStr=top3.map((h,i)=>{
            const mark=i===0?'\u25CE':i===1?'\u25CB':'\u25B2';
            const scoreStr=h.score!=null?' ('+Number(h.score).toFixed(3)+')':'';
            return`${mark} ${h.horse_number||'?'}番 ${h.horse_name||''}${scoreStr}`;
