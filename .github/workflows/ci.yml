name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # tests/test_api.py は起動中の API サーバーと学習済みモデルが必要なため CI では除外
      - name: Run unit tests
        run: pytest tests -q --ignore=tests/test_api.py
